# OCB manifest: one binary, three roles (workstation `edge`, server `gateway`,
# server `host-agent`). `dist.version` is the artefact's own version and the
# only release trigger — read AGENTS.md "Version and release flow" before
# bumping it. Linked is not enabled: a component costs binary size and stays
# dormant until a config wires it.
dist:
  name: otelcol-otelbox
  description: >-
    Durable OpenTelemetry collector (otelbox) — redaction + file_storage WAL on
    every outbound leg, in the workstation edge, server gateway and server
    host-agent roles.
  output_path: ./_build
  # Unquoted: the Go manifest resolver requires one stable semantic version.
  version: 2.6.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.163.0
  # All three roles scrape their own endpoint through this, so operational
  # metrics take the same durable, queued path as everything else.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.163.0
  # Linux-only, and it execs the `journalctl` binary rather than reading the
  # journal itself — so only the host-agent role can wire it, never the
  # `FROM scratch` gateway image, which has no binary to exec.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.163.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.163.0
  # Deliberately no batchprocessor: it acknowledges into an in-memory channel
  # before the persistent exporter queue and can therefore violate the WAL
  # boundary. Every role batches inside `sending_queue` after durable enqueue.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor v0.163.0
  # Selects the trace subset that has an additional required recipient.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.163.0
  # Linked and wired by no role profile, which is the point. The reference
  # profiles keep a classification such as `otelbox.telemetry.class` a
  # producer's own statement and let the gateway's `filter` only read it; that
  # contract is unchanged. This exists for the deployment whose producer cannot
  # make the statement itself but whose collector can already tell the stream
  # apart — a dedicated listener, a named scrape job, a journald unit set — and
  # which therefore renders its own `resource/<name>` instance on exactly that
  # pipeline rather than on everything the role carries.
  #
  # Place any such instance BEFORE `redaction/secrets`, where
  # `resource_detection` sits, so an attribute this adds is subject to the same
  # patterns as an ingested one. `action: upsert` overwrites a producer that did
  # make the statement; `insert` defers to it. Choose deliberately — the gateway
  # routes on the result, so the wrong verb silently reroutes traffic.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.163.0
  # The `resource` processor above reaches resource attributes only. A backend
  # may read a field from SPAN attributes and nowhere else — Langfuse reads a
  # trace's user and tags exactly that way — and nothing else linked here can
  # write one. This is the smallest component that can, and the edge role wires
  # it for that single purpose.
  #
  # Same placement rule as `resource/<name>`: BEFORE `redaction/secrets`, so an
  # attribute it adds is scanned by the same patterns as an ingested one. Its
  # OTTL `set` overwrites unconditionally, so wire an instance only on a pipeline
  # whose producers are known not to set the field themselves.
  #
  # Keep values that reach an attribute scalar. `Split` and `append` would build
  # a slice, which `redaction/secrets` does not inspect under
  # `redact_all_types: false` — that would be an injected value exempt from the
  # control every other one passes.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.163.0
  # Local: drops a selected-trace span whose (trace_id, span_id) the recipient
  # path already accepted, because that recipient stores every copy. Its index
  # lives in a storage extension. Pinned at the Collector release it builds
  # against, like the wrappers below.
  - gomod: github.com/abrosimov/otelcol-otelbox/processor/spandedup v0.163.0
    path: ./internal/processors/spandedup

exporters:
  # Thin wrappers put the persistent queue around standard upstream exporters,
  # then reclassify only authentication rejection for the outer retry sender.
  - gomod: github.com/abrosimov/otelcol-otelbox/exporter/otlpauthretry v0.163.0
    path: ./internal/exporters/otlpauthretry
  - gomod: github.com/abrosimov/otelcol-otelbox/exporter/otlphttpauthretry v0.163.0
    path: ./internal/exporters/otlphttpauthretry
  # CI backend double only. Role profiles never use an unaudited local sink.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.163.0

extensions:
  # The only health check, wired by all three roles. Development stability where
  # v1 was alpha, taken deliberately: one answer for every role was worth more
  # than the maturity label, and keeping v1 beside it would have kept the split.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckv2extension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.163.0

# No `replaces` block. A version-form `replace` overrides minimal version
# selection in both directions, so it downgrades as readily as it raises. A
# version this repository declares belongs in `require` in
# internal/exporters/*/go.mod or internal/processors/spandedup/go.mod, which
# reach the generated module through the `path:` entries above.
