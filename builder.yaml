# OCB manifest: one binary, three roles (workstation `edge`, server `gateway`,
# server `host-agent`). `dist.version` is the artefact's own version and the
# only release trigger — read AGENTS.md "Version and release flow" before
# bumping it. Linked is not enabled: a component costs binary size and stays
# dormant until a config wires it.
dist:
  name: otelcol-otelbox
  description: >-
    Durable OpenTelemetry collector (otelbox) — redaction + file_storage WAL on
    every outbound leg, in the workstation edge, server gateway and server
    host-agent roles.
  output_path: ./_build
  # Unquoted: the Go manifest resolver requires one stable semantic version.
  version: 2.4.1

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.158.0
  # All three roles scrape their own endpoint through this, so operational
  # metrics take the same durable, queued path as everything else.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.158.0
  # Linux-only, and it execs the `journalctl` binary rather than reading the
  # journal itself — so only the host-agent role can wire it, never the
  # `FROM scratch` gateway image, which has no binary to exec.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.158.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.158.0
  # Deliberately no batchprocessor: it acknowledges into an in-memory channel
  # before the persistent exporter queue and can therefore violate the WAL
  # boundary. Every role batches inside `sending_queue` after durable enqueue.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor v0.158.0
  # Selects the trace subset that has an additional required recipient.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.158.0
  # Linked and wired by no role profile, which is the point. The reference
  # profiles keep a classification such as `otelbox.telemetry.class` a
  # producer's own statement and let the gateway's `filter` only read it; that
  # contract is unchanged. This exists for the deployment whose producer cannot
  # make the statement itself but whose collector can already tell the stream
  # apart — a dedicated listener, a named scrape job, a journald unit set — and
  # which therefore renders its own `resource/<name>` instance on exactly that
  # pipeline rather than on everything the role carries.
  #
  # Place any such instance BEFORE `redaction/secrets`, where
  # `resource_detection` sits, so an attribute this adds is subject to the same
  # patterns as an ingested one. `action: upsert` overwrites a producer that did
  # make the statement; `insert` defers to it. Choose deliberately — the gateway
  # routes on the result, so the wrong verb silently reroutes traffic.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.158.0

exporters:
  # Thin wrappers put the persistent queue around standard upstream exporters,
  # then reclassify only authentication rejection for the outer retry sender.
  - gomod: github.com/abrosimov/otelcol-otelbox/exporter/otlpauthretry v0.158.0
    path: ./internal/exporters/otlpauthretry
  - gomod: github.com/abrosimov/otelcol-otelbox/exporter/otlphttpauthretry v0.158.0
    path: ./internal/exporters/otlphttpauthretry
  # CI backend double only. Role profiles never use an unaudited local sink.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.158.0

extensions:
  # The only health check, wired by all three roles. Development stability where
  # v1 was alpha, taken deliberately: one answer for every role was worth more
  # than the maturity label, and keeping v1 beside it would have kept the split.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckv2extension v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.158.0

# Transitive security floors, not component pins. Both modules arrive through
# the v0.158.0 components above, which still require versions the image scan
# rejects as fixable HIGH/CRITICAL findings; neither upstream release carries a
# raised requirement yet. `replace` is the only lever OCB offers over a
# generated go.mod, so the floor is stated here rather than by hand-editing an
# artefact the build regenerates. Each entry names the CVE it answers and the
# first upstream version that fixes it, and each is removed once a component
# pin above requires that version or later on its own — an unnecessary replace
# silently holds a dependency back.
replaces:
  # CVE-2026-56854: golang.org/x/crypto/ssh does not enforce source-address
  # restrictions. This binary links no SSH server, so govulncheck reports no
  # reachable symbol, but the module is in the build info the scanner reads.
  - golang.org/x/crypto => golang.org/x/crypto v0.55.0
  # CVE-2026-84304: gRPC-Go before 1.83.1. The gateway leg is gRPC, so this one
  # is on the path every role uses.
  - google.golang.org/grpc => google.golang.org/grpc v1.83.1
