# OCB manifest for the durable otelbox collector. One binary serves two roles:
# `edge` on a workstation and `gateway` on the remote server. Built in CI by
# .github/workflows/otelcol-otelbox.yml; deployment lives in the consuming
# repositories, not here.
#
# dist.version is this artefact's own semantic version and the only source of
# truth for a release: bump it, merge to master, CI publishes the matching
# `v<version>` release. No hand-cut tags. What each component means, given that
# a release carries the shared configuration layer as well as the binary:
#   major — a consuming repository has to change its role configuration, because
#           config/ changed shape under it;
#   minor — a new component is linked, or the base layer grew something a role
#           layer may use without being obliged to;
#   patch — a rebuild over the same component set and the same base layer.
#
# The upstream collector version is deliberately absent from this number. It
# lives in the gomod pins below and nowhere else: carried here it could only be
# a pre-release suffix, which sorts every build of ours below the upstream
# release it is built on, and it says nothing about what changed here anyway.
#
# Linked is not enabled — a component here is available to the config and costs
# binary size only. Most of the list is dormant until a role config wires it.
dist:
  name: otelcol-otelbox
  description: >-
    Durable OpenTelemetry collector (otelbox) — redaction + file_storage WAL on
    every outbound leg, in both the workstation edge and server gateway roles.
  output_path: ./_build
  # Unquoted: CI reads this with awk, not YAML, and would keep the quotes.
  version: 1.0.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.156.0
  # Backlog replay — reads JSON only, so the backlog cannot be proto or zstd.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otlpjsonfilereceiver v0.156.0
  # The gateway role scrapes its own Prometheus endpoint and the reverse proxy's
  # admin endpoint through this, so its own operational metrics travel the same
  # authenticated path as everything else.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filestatsreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/httpcheckreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tcpcheckreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tlscheckreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sshcheckreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/ntpreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/macosunifiedloggingreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/podmanreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/osqueryreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver v0.156.0
  # Needs the service.profilesSupport feature gate, off by default.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/pprofreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/githubreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/gitlabreceiver v0.156.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.156.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor v0.156.0
  # OTTL. redaction masks attributes and a map-shaped body only; Claude Code's
  # raw API bodies arrive as a string body, which only transform can rewrite.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/remotetapprocessor v0.156.0
  # Collapsed records keep their count in the `log_count` attribute.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/logdedupprocessor v0.156.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/alertmanagerexporter v0.156.0

extensions:
  # healthcheck (Alpha) stays until the config migrates to healthcheckv2.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckv2extension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/remotetapextension v0.156.0
  # Development stability; bind to loopback only.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/mcp v0.156.0

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/sumconnector v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/otlpjsonconnector v0.156.0
