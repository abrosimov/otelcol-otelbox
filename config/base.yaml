# otelbox — SHARED BASE LAYER. Loaded first, always, and never on its own:
#
#   otelcol-otelbox --config config/base.yaml --config <exactly-one-role>.yaml
#
# It exists so the redaction patterns cannot diverge between the workstation and
# the server; held in two role repositories they would drift unnoticed. Later
# `--config` arguments win, maps merge key by key, and a list replaces the
# earlier list wholesale. Declares no pipeline, so it is not runnable alone.

processors:
  # Edge-sized: the workstation shares its host with everything else the
  # developer is doing. The gateway overrides all three.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # A role layer can replace these lists, but doing so defeats the reason this
  # file exists — add patterns here, for both roles, or not at all.
  # allow_all_keys keeps this a deny-list; an allow-list would silently drop
  # every attribute nobody enumerated, leaving healthy-looking empty telemetry.
  redaction/secrets:
    allow_all_keys: true
    blocked_key_patterns:
      - '(?i).*authorization.*'
      - '(?i).*api[._-]?key.*'
      - '(?i).*cookie.*'
      - '(?i)(^|.*[._-])(access|refresh|auth|secret|bearer)[._-]?token($|[._-].*)'
      - '(?i).*password.*'
    blocked_values:
      - '(?i)Bearer\s+\S+'
      - '(?i)(sk|rk|pk|api)[-_][A-Za-z0-9_-]{12,}'

  # Edge-sized, and overridden by the gateway: it merges traffic from every edge,
  # where the same timeout fills a far larger batch and would split the send.
  batch:
    timeout: 5s
    send_batch_size: 2048
    send_batch_max_size: 4096

service:
  telemetry:
    # No `output_paths`: the supervisor owns the log file, and a second writer on
    # the same inode interleaves lines and follows no rotation.
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      # A list, so a role layer needing another port replaces it outright —
      # which is how the gateway gets 8889 instead of a second endpoint.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
