# otelbox — GATEWAY ROLE (reference profile, not deployed).
#
#   otelcol-otelbox --config config/gateway.yaml
#
# One file, no layering: a consuming repository renders the ${env:...} values
# and loads this alone. Marked SHARED blocks are byte-identical in all roles.
#
# The role authenticates one OTLP ingress, redacts accepted telemetry and fans it
# out to every recipient eligible for that signal. Each required recipient owns
# a separate WAL. The reference instantiates one all-signal OTLP/gRPC recipient
# and one selected-traces OTLP/HTTP recipient as examples of the two eligibility
# patterns; neither the binary nor the profile fixes deployment cardinality. A
# deployment renders every required recipient with its own stable component ID.
#
# Required environment: OTELBOX_STORAGE_DIR, OTELBOX_INGEST_TOKEN_FILE,
# OTELBOX_ALL_SIGNALS_RECIPIENT_ENDPOINT,
# OTELBOX_SELECTED_TRACES_ENDPOINT, OTELBOX_SELECTED_TRACES_AUTH_HEADER_FILE,
# OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_NAME and
# OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_VALUE. Bind, health, memory and queue
# values have safe reference defaults and should be rendered explicitly in
# production.

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: ${env:OTELBOX_HEALTH_ENDPOINT:-127.0.0.1:14323}
      status:
        enabled: true
        path: /status
      # The expanded configuration includes credential paths and is not a
      # public diagnostics surface.
      config:
        enabled: false
    component_health:
      include_permanent_errors: true
      include_recoverable_errors: false

  # Static bearer is the explicit 2.0 first cut. The repository contract is one
  # URL-safe bare token per line with no whitespace or comments, even though the
  # pinned parser ignores text after the first whitespace. Empty reloads are
  # rejected upstream and leave the previous allowlist active; replace the last
  # token with a non-client revocation token instead of truncating the file.
  bearertokenauth/ingest:
    filename: ${env:OTELBOX_INGEST_TOKEN_FILE}

  # Arbitrary outbound headers keep the profile independent of the concrete
  # selected-trace backend. The credential file contains the complete header
  # value, for example `Basic <base64>`, and is watched for rotation.
  headers_setter/selected_traces:
    headers:
      - action: upsert
        key: authorization
        value_file: ${env:OTELBOX_SELECTED_TRACES_AUTH_HEADER_FILE}
      - action: upsert
        key: ${env:OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_NAME}
        value: ${env:OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_VALUE}

  # Each all-signal gRPC recipient owns three capped bbolt files: traces,
  # metrics and logs. The selected-traces recipient owns only a traces file.
  # Queue bytes are payload bytes, not exact bbolt allocation, so max_size keeps
  # 50% headroom over the queue for database overhead and compaction.
  file_storage/all_signals:
    directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/all_signals
    create_directory: true
    fsync: true
    max_size: ${env:OTELBOX_RECIPIENT_STORAGE_MAX_SIZE_BYTES:-12884901888}
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/compaction/all_signals
      cleanup_on_start: true

  file_storage/selected_traces:
    directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/selected_traces
    create_directory: true
    fsync: true
    max_size: ${env:OTELBOX_RECIPIENT_STORAGE_MAX_SIZE_BYTES:-12884901888}
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/compaction/selected_traces
      cleanup_on_start: true

receivers:
  # The loopback default prevents an omitted bind variable from turning `:port`
  # into a wildcard listener. A public ingress must opt into its bind address.
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELBOX_BIND_HOST:-127.0.0.1}:14319
        # Edge and host-agent batches stop at 1.5 MiB. Two MiB leaves framing
        # headroom without permitting the old 32 MiB per-stream allocation.
        max_recv_msg_size_mib: 2
        # This limit is per connection. Total pre-processor exposure is bounded
        # by client connections as well as streams, so ingress rate limiting
        # remains a deployment responsibility.
        max_concurrent_streams: ${env:OTELBOX_INGEST_MAX_CONCURRENT_STREAMS:-16}
        auth:
          authenticator: bearertokenauth/ingest
      http:
        endpoint: ${env:OTELBOX_BIND_HOST:-127.0.0.1}:14320
        max_request_body_size: 2097152
        read_header_timeout: 10s
        read_timeout: 30s
        write_timeout: 30s
        idle_timeout: 1m
        auth:
          authenticator: bearertokenauth/ingest

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-gateway
          scrape_interval: 30s
          static_configs:
            - targets:
                - ${env:OTELBOX_BIND_HOST:-127.0.0.1}:8889

processors:
  # The gateway profile targets a memory-limited container. Percentages are
  # meaningful only when the deployment supplies a cgroup memory limit; the
  # deployment must set GOMEMLIMIT below that limit as the primary Go ceiling.
  memory_limiter:
    check_interval: 1s
    limit_percentage: ${env:OTELBOX_MEMORY_LIMIT_PERCENTAGE:-75}
    spike_limit_percentage: ${env:OTELBOX_MEMORY_SPIKE_LIMIT_PERCENTAGE:-15}

  # >>> SHARED — byte-identical in all three role profiles; CI compares hashes.
  # A bounded credential deny-list, not a general PII scrubber. It scans
  # attribute keys and string values plus scalar and structured log bodies; it
  # cannot inspect every OTLP string carrier. docs/redaction.md owns the exact
  # coverage boundary and producer obligations. Add patterns in every profile.
  redaction/secrets:
    allow_all_keys: true
    # Preserve non-string attribute types. Nested map/slice attributes are a
    # documented producer-side boundary because scanning them would stringify
    # the whole value whenever one nested match fired.
    redact_all_types: false
    # Counts, never key names. This is record-level evidence that the control
    # fired, not a replacement for a far-end leak probe.
    summary: info
    blocked_key_patterns:
      - '(?i)(^|.*[._-])(auth|authorization|cookie|token|secret|credential|password|passwd|pwd|passphrase|signature|dsn)($|[._-].*)'
      - '(?i)(^|.*[._-])(api[._-]?key|private[._-]?key|connection[._-]?string)($|[._-].*)'
    blocked_values:
      - '(?i)\b(Bearer|Basic)\s+\S+'
      - '(?i)^(sk|rk|pk)[-_][A-Za-z0-9_-]{16,}$'
      - '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
      - '\b(AKIA|ASIA)[A-Z0-9]{16}\b'
      - '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
      - '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
      - '\bAIza[0-9A-Za-z_-]{20,}\b'
      - '(?i)\b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
      - '(?i)"?(api[._-]?key|client[._-]?secret|password|passwd|pwd|passphrase|token)"?\s*[:=]\s*"?[^",\s;&}]+"?'
      - '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'

  # <<< SHARED

  # The filter processor drops matching data. Therefore this condition removes
  # every trace resource that is not explicitly classified for the additional
  # selected-traces recipient. Producers own the classification and the target's
  # semantic span attributes; the gateway neither guesses nor rewrites them.
  filter/selected_traces:
    error_mode: propagate
    trace_conditions:
      - 'resource.attributes["otelbox.telemetry.class"] != "llm"'

exporters:
  # A consuming repository renders one named instance per all-signal recipient.
  otlp_grpc/all_signals:
    endpoint: ${env:OTELBOX_ALL_SIGNALS_RECIPIENT_ENDPOINT}
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/all_signals
      num_consumers: ${env:OTELBOX_EXPORTER_CONSUMERS:-2}
      sizer: bytes
      # A deployment override must remain larger than the 2 MiB ingest
      # envelope; an oversized item cannot fit a blocking persistent queue.
      queue_size: ${env:OTELBOX_RECIPIENT_QUEUE_SIZE_BYTES:-8589934592}
      block_on_overflow: true
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        # Three MiB stays below the common 4 MiB downstream gRPC default.
        max_size: ${env:OTELBOX_RECIPIENT_MAX_PAYLOAD_BYTES:-3145728}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

  # `otlp_http` is the canonical v0.157 type. The endpoint is an OTLP base URL;
  # the exporter appends `/v1/traces`. Protocol headers and credentials are
  # deployment data supplied through the generic extension above.
  otlp_http/selected_traces:
    endpoint: ${env:OTELBOX_SELECTED_TRACES_ENDPOINT}
    auth:
      authenticator: headers_setter/selected_traces
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/selected_traces
      num_consumers: ${env:OTELBOX_EXPORTER_CONSUMERS:-2}
      sizer: bytes
      queue_size: ${env:OTELBOX_RECIPIENT_QUEUE_SIZE_BYTES:-8589934592}
      block_on_overflow: true
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: ${env:OTELBOX_RECIPIENT_MAX_PAYLOAD_BYTES:-3145728}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - healthcheckv2
    - bearertokenauth/ingest
    - headers_setter/selected_traces
    - file_storage/all_signals
    - file_storage/selected_traces
  telemetry:
    # >>> SHARED — byte-identical in all three role profiles; CI compares hashes.
    # No `output_paths`: a second writer on the same inode interleaves lines and
    # follows no rotation.
    logs:
      level: info
      encoding: json
    # <<< SHARED
    metrics:
      # >>> SHARED — byte-identical in all three role profiles; CI compares hashes.
      # `detailed`, because `normal` strips `error_type` and `error_permanent`
      # from otelcol_exporter_send_failed_*, and without those this collector
      # cannot tell a rejected credential from an unreachable peer — which is
      # the failure this repository exists to make visible.
      level: detailed
      # <<< SHARED
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTELBOX_BIND_HOST:-127.0.0.1}
                port: 8889
  pipelines:
    # All traces remain required by every ordinary trace recipient.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals]
    # Only explicitly classified traces enter the additional HTTP WAL. A mixed
    # OTLP request is acknowledged only after both required pipeline paths have
    # persisted their eligible records.
    traces/selected:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets, filter/selected_traces]
      exporters: [otlp_http/selected_traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals]
