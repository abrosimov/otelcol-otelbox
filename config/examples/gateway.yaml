# otelbox — GATEWAY ROLE LAYER (reference profile, not deployed).
#
#   otelcol-otelbox --config config/base.yaml --config config/examples/gateway.yaml
#
# The authoritative copy lives in `remote_server_setup`
# (`roles/otel_gateway/files/config.yaml`); this one exists so CI can prove the
# base layer still composes into a runnable role, which is worth something only
# while it stays a faithful mirror. Secrets arrive as environment variables or
# mounted files from Ansible Vault: OTELBOX_GATEWAY_TOKEN_FILE,
# OTELBOX_GATEWAY_STORAGE, CLICKSTACK_INGESTION_API_KEY.

extensions:
  bearertokenauth/ingest:
    filename: ${env:OTELBOX_GATEWAY_TOKEN_FILE}

  # One WAL per backend: SigNoz being down must not eat the disk budget
  # ClickStack's backlog relies on, and a corrupted bbolt file must cost one
  # backend rather than both.
  file_storage/signoz:
    directory: ${env:OTELBOX_GATEWAY_STORAGE}/signoz
    create_directory: true
    fsync: true
    # Caps the single bbolt file, not the directory, and compaction writes a
    # copy alongside the live one — so leave headroom. Agreed ceiling: 20 GiB.
    max_size: 10737418240
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_GATEWAY_STORAGE}/compaction/signoz

  file_storage/clickstack:
    directory: ${env:OTELBOX_GATEWAY_STORAGE}/clickstack
    create_directory: true
    fsync: true
    # See file_storage/signoz.
    max_size: 10737418240
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_GATEWAY_STORAGE}/compaction/clickstack

receivers:
  # Loopback even though this is the public ingress: the reverse proxy
  # terminates TLS and forwards here. Authentication stays on regardless — the
  # proxy is a network hop, not a trust boundary.
  otlp/public:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14319
        max_recv_msg_size_mib: 8
        auth:
          authenticator: bearertokenauth/ingest
      http:
        endpoint: 127.0.0.1:14320
        auth:
          authenticator: bearertokenauth/ingest

  # Unauthenticated, for co-located workloads with no token to present;
  # reachability is the access control.
  otlp/local:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14321
        max_recv_msg_size_mib: 8
      http:
        endpoint: 127.0.0.1:14322

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

  # Scraped into the pipelines so the gateway's own metrics take the same
  # durable, queued path as customer telemetry.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-gateway
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:8889
        - job_name: caddy
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:2019

processors:
  # Both blocks override the base layer's edge-sized values, which would throttle
  # a box that runs nothing else and merges every edge's traffic. Every key is
  # restated because maps merge — an omitted one would keep the edge value.
  # `redaction/secrets` is deliberately not restated: it comes from the base.
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 8192
    send_batch_max_size: 8192
    timeout: 5s

exporters:
  # `otlp_grpc`, not `otlp`: plain `otlp` is the deprecated alias in v0.156.0.
  otlp_grpc/signoz:
    endpoint: 127.0.0.1:14317
    tls:
      # Loopback to a co-located container, so the traffic never leaves the
      # kernel. No precedent for the edge→gateway leg, which must verify.
      insecure: true
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/signoz
      # Byte-sized to match the storage cap it protects: an item count blocks
      # whatever the items weigh. 9 GiB sits under the 10 GiB file cap so the
      # exporter's overflow policy binds before a storage write fails.
      sizer: bytes
      queue_size: 9663676416
      # Splitting the backends across pipelines would not decouple them: fan-out
      # is sequential on the caller's goroutine (`internal/fanoutconsumer`), so
      # size the queues to make overflow an incident and alert before it.
      block_on_overflow: true
      # Byte-sized: this governs the payload handed to the backend, which is a
      # property of the backend rather than of the disk budget.
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: 3145728
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # No deadline: the WAL exists so an outage is survived, not timed out.
      max_elapsed_time: 0s

  otlp_grpc/clickstack:
    endpoint: 127.0.0.1:24317
    headers:
      authorization: ${env:CLICKSTACK_INGESTION_API_KEY}
    tls:
      # Loopback to a co-located container; see otlp_grpc/signoz.
      insecure: true
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/clickstack
      # See otlp_grpc/signoz for the sizing and the overflow policy.
      sizer: bytes
      queue_size: 9663676416
      block_on_overflow: true
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: 3145728
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - bearertokenauth/ingest
    - file_storage/signoz
    - file_storage/clickstack
  telemetry:
    metrics:
      # `detailed` because the per-queue series are what overflow alerting is
      # built on, and this host carries the cardinality.
      level: detailed
      # 8888 is taken on this host. A list, so this replaces the base entry
      # rather than adding a second endpoint.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    # Redaction runs here too, not only on the edges: otlp/local accepts
    # telemetry that never passed through one, so this makes the guarantee a
    # property of the gateway rather than of every producer behaving.
    traces:
      receivers: [otlp/public, otlp/local]
      processors: [memory_limiter, redaction/secrets, batch]
      exporters: [otlp_grpc/signoz, otlp_grpc/clickstack]
    metrics:
      receivers: [otlp/public, otlp/local]
      processors: [memory_limiter, redaction/secrets, batch]
      exporters: [otlp_grpc/signoz, otlp_grpc/clickstack]
    logs:
      receivers: [otlp/public, otlp/local]
      processors: [memory_limiter, redaction/secrets, batch]
      exporters: [otlp_grpc/signoz, otlp_grpc/clickstack]
    # Same processors as everything else: scrape targets and container labels
    # are attributes too, and a credential in one would reach the backends.
    metrics/self:
      receivers: [prometheus/self, docker_stats]
      processors: [memory_limiter, redaction/secrets, batch]
      exporters: [otlp_grpc/signoz, otlp_grpc/clickstack]
