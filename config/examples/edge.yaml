# otelbox — EDGE ROLE LAYER (reference profile, not deployed).
#
#   otelcol-otelbox --config config/base.yaml --config config/examples/edge.yaml
#
# It demonstrates what the edge role can do and how it is configured; it is not
# a copy of any deployment, so anything naming a neighbour, a socket or a
# credential is an ${env:...} reference the supervisor fills in. The shape is
# the part worth preserving: local ingest, origin stamped before redaction,
# and one on-disk WAL in front of the single outbound leg. Environment:
# OTELBOX_EDGE_{BIND_HOST,STORAGE,ENDPOINT,TOKEN,PROBE_URL,NTP_ENDPOINT,
# HEALTH_ENDPOINT}.

extensions:
  # `healthcheckv2`, not the alpha `health_check`, which is no longer linked: all
  # three roles answer this question one way now. Its `development` stability was
  # accepted knowingly — no telemetry passes through it, only a probe.
  healthcheckv2:
    # Required. Without it the extension serves the v1 responder instead, which
    # answers 200 on `/` and on every path beneath it, and ignores the keys below.
    use_v2: true
    http:
      # A bind address is deployment data — a container probe and a launchd agent
      # want different ones. 127.0.0.1:13133 is the conventional edge value.
      endpoint: ${env:OTELBOX_EDGE_HEALTH_ENDPOINT}
      status:
        enabled: true
        # v2's default. v1's `/` is not served under it, so a probe has to move
        # with this rename rather than keep answering.
        path: /status
      # Serves the merged configuration with every ${env:...} already expanded,
      # this role's gateway token included. Restated rather than left to default.
      config:
        enabled: false
    # NO `grpc:` KEY, and the omission is the setting: there is no
    # `enabled: false` for that responder, and writing the key even bare opens
    # one on 127.0.0.1:13132.
    component_health:
      # Buys 500 while a component sits in a permanent error, which upstream
      # reports only for a failed start or shutdown. Not a delivery check: a
      # rejected export sets no component status at all, which is why the
      # incident behind this repository showed green — that is what
      # `otelcol_exporter_send_failed_*` and the `http_check` below are for.
      include_permanent_errors: true
      # Off. Nothing this role wires reports a recoverable status today, and one
      # that did would take the endpoint red after `recovery_duration` — during a
      # sleeping laptop or a gateway outage, which is what the WAL exists to ride
      # out rather than alert on.
      include_recoverable_errors: false

  # The WAL: anything accepted from a local application is on disk before it is
  # acknowledged, so a sleeping or rebooted laptop resumes instead of dropping.
  file_storage/gateway:
    directory: ${env:OTELBOX_EDGE_STORAGE}/gateway
    create_directory: true
    fsync: true
    max_size: 5368709120
    # bbolt never returns freed pages, so without compaction one spike keeps
    # 5 GiB of workstation disk for good.
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_EDGE_STORAGE}/compaction/gateway

receivers:
  # These listeners have no authentication, so whoever can reach them can write:
  # the conventional bind is loopback, and the deployment owns that choice.
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELBOX_EDGE_BIND_HOST}:4317
        # 32 MiB, binding the *uncompressed* message, and matched to the
        # gateway's own limit so a record this edge accepts is one the gateway
        # will too. On gRPC the check runs before authentication; on HTTP it
        # runs after.
        max_recv_msg_size_mib: 32
      http:
        endpoint: ${env:OTELBOX_EDGE_BIND_HOST}:4318
        # The same 32 MiB in bytes. Stated rather than left to confighttp's
        # 20 MiB default, which would silently make HTTP the tighter transport.
        max_request_body_size: 33554432

  # The workstation's own vitals. Cardinality is bounded inside the receiver
  # rather than with a `filter` processor, so the series are never built.
  #
  # NO `process` SCRAPER, and muting its errors is not the fix — see AGENTS.md
  # "The process scraper" for why per-PID series are unbounded here and why
  # `process.command_line` is a credential-disclosure risk.
  host_metrics:
    # A laptop, not a server: minute resolution costs less battery than it
    # gives up in granularity.
    collection_interval: 60s
    scrapers:
      # v0.157.0 made the per-core `cpu` attribute on `system.cpu.time` opt-in,
      # and it is deliberately not re-enabled: time by state is what a laptop is
      # asked, and the attribute multiplies the series count by the core count.
      cpu:
      disk:
      filesystem:
        # A strict allowlist, not excludes: on APFS every volume in a container
        # reports the container's total and free space, so `/` alone carries
        # the capacity signal, and /Volumes/ mounts (disk images, external
        # drives, network shares) are fresh (device, mountpoint) pairs that die
        # two scrapes later. Includes and excludes are ANDed, so an exclude
        # list beside this one would be dead code.
        include_mount_points:
          match_type: strict
          mount_points:
            - /
      load:
      memory:
      network:
        # macOS keeps a dozen virtual interfaces up at all times — VPN tunnels,
        # AirDrop, Wi-Fi Direct, the bridges a hypervisor leaves behind — and
        # each is a full set of series describing no link the machine uses.
        exclude:
          match_type: regexp
          interfaces:
            - ^utun\d+$
            - ^awdl\d+$
            - ^llw\d+$
            - ^bridge\d+$
            - ^ap\d+$
            - ^gif\d+$
            - ^stf\d+$
      paging:
      system:

  # The collector's own metrics, scraped rather than pushed out of
  # `service::telemetry`: that export path is a separate OpenTelemetry SDK, so
  # it bypasses redaction, `batch`, the sending queue and the WAL — and
  # `otelcol_exporter_send_failed_*` would then travel with no durability,
  # losing exactly the evidence of the outage it describes.
  #
  # The same bind host as the endpoint it scrapes, set under service::telemetry
  # below, so the target follows wherever the deployment puts the listener.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-edge
          scrape_interval: 30s
          static_configs:
            - targets:
                - ${env:OTELBOX_EDGE_BIND_HOST}:8888

  # A laptop sleeps, and clock skew is the one defect telemetry cannot be
  # corrected for after the fact. One datapoint; which time source to trust is
  # the deployment's, and the receiver refuses any interval under 30 minutes.
  ntp:
    endpoint: ${env:OTELBOX_EDGE_NTP_ENDPOINT}
    collection_interval: 30m

  # Turns "the gateway is not accepting our token" into a metric. The deployed
  # edge once failed every export for days while the process, the supervisor
  # and the health endpoint all reported healthy.
  #
  # Authentication runs ahead of the OTLP handler, so a rejected token answers
  # 401 and an accepted one answers a method error — 405, never 200. Alert on
  # `http.status_class` being 4xx with `http.status_code` 401, not on
  # `httpcheck.error`, which stays zero because the exchange itself succeeded.
  http_check:
    collection_interval: 60s
    targets:
      # A URL, which OTELBOX_EDGE_ENDPOINT is not — that one is a gRPC
      # host:port. This probes the gateway's OTLP/HTTP endpoint instead.
      - endpoint: ${env:OTELBOX_EDGE_PROBE_URL}
        method: GET
        headers:
          authorization: "Bearer ${env:OTELBOX_EDGE_TOKEN}"

processors:
  # In the role layer, not the base: this stamps origin, and origin is exactly
  # what the roles do not share — running it on the gateway would restamp
  # relayed telemetry with the server's identity. `override: false` protects
  # attributes an application set for itself.
  #
  # NOTE: `resource_detection` is the canonical type; `resourcedetection` is a
  # deprecated alias that still loads.
  resource_detection:
    detectors: [env, system]
    timeout: 2s
    override: false

exporters:
  # `otlp_grpc`, not `otlp`: plain `otlp` is the deprecated exporter alias.
  otlp_grpc/gateway:
    endpoint: ${env:OTELBOX_EDGE_ENDPOINT}
    headers:
      authorization: "Bearer ${env:OTELBOX_EDGE_TOKEN}"
    tls:
      # NEVER true. The header above is a bearer credential that grants ingest,
      # and an unverified peer is simply handed it — which is why the
      # integration test mints a CA per run rather than turning this off.
      insecure: false
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      # Bound to the WAL above, so enqueue means persisted.
      storage: file_storage/gateway
      sizer: items
      queue_size: 500000
      # Backpressure rather than silent loss — acceptable because the producers
      # are this developer's own processes.
      block_on_overflow: true
      # Queue in items, batcher in bytes: how much backlog is held is a
      # different question from how large a payload the gateway should receive.
      # A record above max_size is dropped here rather than split, so keep the
      # invariant: max_size < the gateway's max_recv_msg_size_mib, which is
      # itself ≤ its max_request_body_size. 8 MiB leaves a fourfold margin.
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: 8388608
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # No deadline: a non-zero value would drop the backlog the disk was bought
      # to hold. Overflow, not expiry, is the intended loss mechanism.
      max_elapsed_time: 0s

service:
  extensions: [healthcheckv2, file_storage/gateway]
  telemetry:
    metrics:
      # Overrides the base layer's `normal`, which drops the whole otelgrpc and
      # otelhttp meters and strips `error_type` and `error_permanent` from
      # `otelcol_exporter_send_failed_*` — so at `normal` this edge cannot tell
      # a rejected credential from an unreachable gateway, which is the
      # incident this repository exists to prevent. It costs the RPC and HTTP
      # histogram families in what the edge ships.
      level: detailed
      # A list, so this replaces the base entry outright; only the bind host
      # differs, because the port is this repository's convention and the
      # address is the deployment's.
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTELBOX_EDGE_BIND_HOST}
                port: 8888
  pipelines:
    # Same shape in all three signals: redaction must be the last thing that can
    # alter an attribute, and detection must precede it so what it adds is
    # subject to the same patterns.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
    # The machine observing itself, on the same processors as everything else:
    # a scrape target label or an HTTP probe header is an attribute too, and a
    # credential in one would otherwise reach the gateway unredacted.
    metrics/self:
      receivers: [host_metrics, prometheus/self, ntp, http_check]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
