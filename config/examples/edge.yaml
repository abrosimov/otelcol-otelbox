# otelbox — EDGE ROLE LAYER (reference profile, not deployed).
#
#   otelcol-otelbox --config config/base.yaml --config config/examples/edge.yaml
#
# The authoritative copy lives in `devbox-setup`; this one exists so CI can
# prove the base layer still composes into a runnable role, which is worth
# something only while it stays a faithful mirror. Secrets arrive as environment
# variables from launchd: OTELBOX_EDGE_{STORAGE,ENDPOINT,TOKEN}.

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

  # The WAL: anything accepted from a local application is on disk before it is
  # acknowledged, so a sleeping or rebooted laptop resumes instead of dropping.
  file_storage/gateway:
    directory: ${env:OTELBOX_EDGE_STORAGE}/gateway
    create_directory: true
    fsync: true
    max_size: 5368709120
    # bbolt never returns freed pages, so without compaction one spike keeps
    # 5 GiB of workstation disk for good.
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_EDGE_STORAGE}/compaction/gateway

receivers:
  # Loopback only: these listeners have no authentication because the kernel is
  # doing the access control instead.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        # Below what the gateway accepts, so an oversized payload is refused
        # while it can still be attributed to a caller.
        max_recv_msg_size_mib: 8
      http:
        endpoint: 127.0.0.1:4318

processors:
  # In the role layer, not the base: this stamps origin, and origin is exactly
  # what the two roles do not share — running it on the gateway would restamp
  # relayed telemetry with the server's identity. `override: false` protects
  # attributes an application set for itself.
  #
  # NOTE: `resource_detection` is canonical in v0.156.0; `resourcedetection` is
  # the deprecated alias the deployed copy still uses.
  resource_detection:
    detectors: [env, system]
    timeout: 2s
    override: false

exporters:
  # `otlp_grpc`, not `otlp`: plain `otlp` is the deprecated exporter alias in
  # v0.156.0.
  otlp_grpc/gateway:
    endpoint: ${env:OTELBOX_EDGE_ENDPOINT}
    headers:
      authorization: "Bearer ${env:OTELBOX_EDGE_TOKEN}"
    tls:
      # NEVER true. This leg crosses the public internet carrying a token that
      # grants ingest; unverified, it is handed to whatever answers the DNS name.
      insecure: false
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      # Bound to the WAL above, so enqueue means persisted.
      storage: file_storage/gateway
      sizer: items
      queue_size: 500000
      # Backpressure rather than silent loss — acceptable because the producers
      # are this developer's own processes.
      block_on_overflow: true
      # Queue in items, batcher in bytes: how much backlog is held is a
      # different question from how large a payload the gateway should receive.
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: 3145728
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # No deadline: a non-zero value would drop the backlog the disk was bought
      # to hold. Overflow, not expiry, is the intended loss mechanism.
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage/gateway]
  pipelines:
    # Same shape in all three signals: redaction must be the last thing that can
    # alter an attribute, and detection must precede it so what it adds is
    # subject to the same patterns.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets, batch]
      exporters: [otlp_grpc/gateway]
