name: otelcol-otelbox

# Build, prove and publish the OCB collector for all three roles. Which target
# a role runs on is a deployment's business; the matrix exists because
# smoke-check.sh executes the binary, so each target has to build natively.
#
# `dist.version` in builder.yaml is the single source of truth: bump it, merge,
# and this run publishes `v<version>` — there is no tag trigger, so a hand-cut
# tag does nothing.
#
# Building and testing are ungated on purpose. Hang them off the
# release-existence check and a change to a role profile or to the harness goes
# uncompiled whenever its version is already released, and CI reports green on
# code it never built. Only publishing is gated, on the version being new, the
# ref being the default branch, and the event not being a pull request. To
# re-publish, delete the release first, then `gh workflow run`.
#
# The `formula` job writes to this repository, which nothing else here does: a
# formula pins checksums that cannot exist before the release they describe.

on:
  # The two path lists are duplicated because the Actions parser does not
  # resolve YAML aliases — an anchor would silently match everything.
  push:
    branches: [master]
    # Documentation is absent on purpose: it cannot break a build.
    paths:
      - builder.yaml
      - smoke-check.sh
      - shared-config-check.sh
      - Dockerfile
      - .dockerignore
      - config/**
      - test/**
      - Formula/**
      - renovate.json5
      - .github/workflows/otelcol-otelbox.yml
  pull_request:
    paths:
      - builder.yaml
      - smoke-check.sh
      - shared-config-check.sh
      - Dockerfile
      - .dockerignore
      - config/**
      - test/**
      - Formula/**
      - renovate.json5
      - .github/workflows/otelcol-otelbox.yml
  workflow_dispatch: {}

# Denied at the top, granted per job: a workflow-level grant would hand every
# job the union of what any one of them needs.
permissions: {}

concurrency:
  group: otelcol-otelbox-${{ github.ref }}
  # A superseded pull-request run is worth nothing. A default-branch run may be
  # mid-publish, and cancelling it leaves a half-published version behind.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve version, release state and publish decision
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release view
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
      publish: ${{ steps.resolve.outputs.publish }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version from builder.yaml and decide whether to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version_lines="$(grep -E '^  version:' builder.yaml || true)"
          if [ "$(printf '%s\n' "$version_lines" | awk 'NF { count++ } END { print count + 0 }')" -ne 1 ]; then
            echo "builder.yaml must contain exactly one dist.version line" >&2
            exit 1
          fi
          version="$(printf '%s\n' "$version_lines" | awk 'NF == 2 { print $2 }')"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "dist.version must be an unquoted stable semantic version, got '${version:-<unreadable>}'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # OCB must match the core modules it compiles, so the toolchain
          # version comes from the otlpreceiver pin and never from dist.version,
          # which describes this artefact alone.
          upstream_pins="$(awk '
            $1 == "-" && $2 == "gomod:" &&
            $3 == "go.opentelemetry.io/collector/receiver/otlpreceiver" { print $4 }
          ' builder.yaml)"
          if [ "$(printf '%s\n' "$upstream_pins" | awk 'NF { count++ } END { print count + 0 }')" -ne 1 ]; then
            echo "builder.yaml must contain exactly one otlpreceiver gomod pin" >&2
            exit 1
          fi
          upstream_pin="$upstream_pins"
          if ! [[ "$upstream_pin" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "otlpreceiver pin must be a stable semantic version prefixed with v, got '$upstream_pin'" >&2
            exit 1
          fi
          upstream_version="${upstream_pin#v}"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

          # An upstream bump rewrites every pin by hand, and a line left behind
          # compiles perfectly into a collector assembled from two releases that
          # nothing downstream would notice.
          disagreeing="$(awk -v pin="$upstream_pin" '
            $1 == "-" && $2 == "gomod:" && $4 != pin { print NR ":" $0 }
          ' builder.yaml)"
          if [ -n "$disagreeing" ]; then
            echo "builder.yaml mixes upstream versions — these pins are not at ${upstream_pin}," >&2
            echo "which is what otlpreceiver says and what OCB will be installed at:" >&2
            printf '%s\n' "$disagreeing" >&2
            echo "  bring every pin to one version. If upstream has genuinely stopped" >&2
            echo "  releasing its modules in lockstep, this guard is the thing that is" >&2
            echo "  wrong and needs replacing — the pins are not." >&2
            exit 1
          fi

          # GHCR package names must be lowercase; the owner login need not be.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/otelcol-otelbox"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if release_probe="$(gh api --silent --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" 2>&1)"; then
            release_http_status="$(printf '%s\n' "$release_probe" \
              | awk '/^HTTP\// { status = $2 } END { print status }')"
            if [ "$release_http_status" != "200" ]; then
              echo "release lookup succeeded with unexpected HTTP status ${release_http_status:-<missing>}" >&2
              exit 1
            fi
            release_exists=true
          else
            release_http_status="$(printf '%s\n' "$release_probe" \
              | awk '/^HTTP\// { status = $2 } END { print status }')"
            if [ "$release_http_status" = "404" ]; then
              release_exists=false
            else
              echo "could not determine whether release v$version exists:" >&2
              printf '%s\n' "$release_probe" >&2
              exit 1
            fi
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

          # A tag without a release is not a new version. Reusing it would make
          # --target ineffective and could publish artefacts against a commit
          # other than the one this run tested.
          if [ "$release_exists" = "false" ]; then
            if tag_probe="$(gh api --silent --include \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2>&1)"; then
              tag_http_status="$(printf '%s\n' "$tag_probe" \
                | awk '/^HTTP\// { status = $2 } END { print status }')"
              if [ "$tag_http_status" = "200" ]; then
                echo "tag v$version exists without a release — refusing to reuse it" >&2
              else
                echo "tag lookup succeeded with unexpected HTTP status ${tag_http_status:-<missing>}" >&2
              fi
              exit 1
            else
              tag_http_status="$(printf '%s\n' "$tag_probe" \
                | awk '/^HTTP\// { status = $2 } END { print status }')"
              if [ "$tag_http_status" != "404" ]; then
                echo "could not determine whether tag v$version exists:" >&2
                printf '%s\n' "$tag_probe" >&2
                exit 1
              fi
            fi
          fi

          # Publishing is the only thing gated: the config layer and the harness
          # must be built and exercised even at an already-released version.
          publish=false
          if [ "$release_exists" = "true" ]; then
            reason="release v$version already exists"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            reason="pull request — build and test only, never publish"
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            reason="ref '$GITHUB_REF_NAME' is not the default branch '$DEFAULT_BRANCH'"
          else
            publish=true
            reason="version $version is new and this is $DEFAULT_BRANCH"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          {
            echo "### otelcol-otelbox $version"
            echo ""
            echo "- upstream collector: \`$upstream_pin\` (from the gomod pins; also the OCB toolchain)"
            echo "- image: \`$image:$version\`"
            echo "- publish: \`$publish\` — $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  static-check:
    name: Static contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: false

      - name: Set up Node.js for the Renovate validator
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"

      - name: Check shell and workflow sources
        run: |
          shellcheck smoke-check.sh shared-config-check.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/otelcol-otelbox.yml

      - name: Check the harness
        working-directory: test/harness
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...

      - name: Check Docker, Formula, Renovate and YAML sources
        env:
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          printf '%s  %s\n' "$HADOLINT_SHA256" "$RUNNER_TEMP/hadolint" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
          ruby -c Formula/otelcol-otelbox.rb
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: false) }' \
            builder.yaml config/*.yaml test/config/*.yaml
          npm_config_cache="$RUNNER_TEMP/npm-cache" npx --yes --package=renovate@44.9.1 \
            renovate-config-validator --strict --no-global renovate.json5
          git diff --check

      - name: Check shared profile regions
        run: ./shared-config-check.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # A darwin-only failure must not hide the linux result: the two targets
      # share a manifest but not a toolchain or a runner image.
      fail-fast: false
      matrix:
        include:
          # Each target builds natively because the smoke check runs the binary
          # to read its `components` output, which a cross-build cannot do. The
          # runner image is pinned so `-latest` cannot move the build host.
          - goos: darwin
            goarch: arm64
            runner: macos-26
            asset: otelcol-otelbox_darwin_arm64
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            asset: otelcol-otelbox_linux_amd64
    env:
      OCB_VERSION: ${{ needs.resolve.outputs.upstream_version }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact because Go 1.25.0 mislinks the generated collector while the
          # patched 1.25 toolchain builds the same manifest successfully.
          go-version: "1.25.12"
          # No go.sum at the repository root — OCB generates one into _build/
          # during this job — and setup-go fails when it has nothing to key a
          # cache on.
          cache: false

      - name: Install OpenTelemetry Collector Builder (OCB)
        # The upstream version the manifest pins, never dist.version — see the
        # resolve step.
        run: go install "go.opentelemetry.io/collector/cmd/builder@v${OCB_VERSION}"

      - name: Build otelcol-otelbox
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Static: the scratch image has no libc, and a workstation binary must
          # not depend on the runner's SDK version.
          CGO_ENABLED: "0"
        run: |
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          install -m 0755 _build/otelcol-otelbox "$ASSET"

      - name: Smoke-check linked components
        # A dropped component fails the build rather than shipping a silently
        # thin binary.
        run: ./smoke-check.sh "./$ASSET" builder.yaml

      - name: Check reachable Go vulnerabilities
        if: matrix.goos == 'linux'
        # Source mode uses the generated collector's call graph. Binary mode
        # reports dormant OpenPGP and S3 crypto symbols pulled in by upstream
        # modules as reachable even though this collector does not call them.
        working-directory: _build
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Checksum
        # sha256sum on Linux, shasum on macOS. Bare hex only, no filename
        # column: that is what the consuming repositories parse.
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"

      - name: Upload the binary and its checksum
        # Nothing downstream rebuilds: the image, the validation, the test and
        # the release all consume these bytes, so what was tested is shipped.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  validate-config:
    name: Validate the role profiles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary
        # Either binary would do — same manifest, and `validate` starts nothing
        # platform-specific — and the Linux runner is a tenth of the price.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Restore the executable bit
        # Artefact downloads lose the mode, so what comes back is unrunnable.
        # Every job that downloads a binary needs this.
        run: chmod +x otelcol-otelbox_linux_amd64

      - name: Check that the profiles still agree on their shared blocks
        # The role profiles used to share a base layer, which made the common
        # settings identical by construction. They no longer do, and this is what
        # replaces that guarantee — it needs no binary, so it runs first and
        # fails before anything else is attempted.
        run: ./shared-config-check.sh

      - name: Validate the three role profiles
        # Each profile is one self-contained file, so this loads the published
        # artefact rather than composing anything.
        #
        # The variables are set per invocation rather than in a job-wide `env:`
        # block because the three roles want different values for the same
        # names — loopback against a wildcard bind, a health port each.
        run: |
          state="$(mktemp -d)"

          # Real files: a validation that passed on a path pointing at nothing
          # would be weaker than one that does not. The ingest contract is one
          # bare URL-safe token per line; outbound header files contain their
          # complete values including the scheme.
          printf 'ci-validation-placeholder\n' \
            > "${state}/ingest-tokens"
          printf 'Bearer ci-validation-placeholder\n' > "${state}/auth-header"
          printf 'Basic ci-validation-placeholder\n' \
            > "${state}/selected-traces-auth-header"

          # Dummies are still required for every non-numeric reference. Contrary
          # to what this workflow used to claim, an unset variable is NOT a load
          # error — the provider warns and yields the zero value — so an omission
          # here would surface as an empty endpoint rather than as a missing
          # variable. The numeric references carry `:-` defaults in the profiles
          # and need nothing.

          echo "--- edge: config/edge.yaml"
          OTELBOX_BIND_HOST=127.0.0.1 \
          OTELBOX_HEALTH_ENDPOINT=127.0.0.1:13133 \
          OTELBOX_STORAGE_DIR="${state}/edge" \
          OTELBOX_UPSTREAM_ENDPOINT=127.0.0.1:14319 \
          OTELBOX_UPSTREAM_AUTH_HEADER_FILE="${state}/auth-header" \
            ./otelcol-otelbox_linux_amd64 validate --config config/edge.yaml

          echo "--- gateway: config/gateway.yaml"
          OTELBOX_BIND_HOST=0.0.0.0 \
          OTELBOX_HEALTH_ENDPOINT=0.0.0.0:14323 \
          OTELBOX_STORAGE_DIR="${state}/gateway" \
          OTELBOX_INGEST_TOKEN_FILE="${state}/ingest-tokens" \
          OTELBOX_ALL_SIGNALS_RECIPIENT_ENDPOINT=127.0.0.1:14317 \
          OTELBOX_SELECTED_TRACES_ENDPOINT=https://example.invalid/otel \
          OTELBOX_SELECTED_TRACES_AUTH_HEADER_FILE="${state}/selected-traces-auth-header" \
          OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_NAME=x-otelbox-validation-version \
          OTELBOX_SELECTED_TRACES_PROTOCOL_HEADER_VALUE=validation-v1 \
            ./otelcol-otelbox_linux_amd64 validate --config config/gateway.yaml

          echo "--- host agent: config/host-agent.yaml"
          OTELBOX_BIND_HOST=127.0.0.1 \
          OTELBOX_HEALTH_ENDPOINT=127.0.0.1:14324 \
          OTELBOX_STORAGE_DIR="${state}/host-agent" \
          OTELBOX_UPSTREAM_ENDPOINT=127.0.0.1:14319 \
          OTELBOX_UPSTREAM_AUTH_HEADER_FILE="${state}/auth-header" \
          OTELBOX_SCRAPE_TARGET_1=127.0.0.1:19001 \
          OTELBOX_SCRAPE_TARGET_2=127.0.0.1:19002 \
          OTELBOX_JOURNAL_UNIT_1=ssh.service \
          OTELBOX_JOURNAL_UNIT_2=cron.service \
            ./otelcol-otelbox_linux_amd64 validate --config config/host-agent.yaml

  config-bundle:
    name: Package the published role profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the configuration bundle
        # An asset rather than the tag's source tarball, which GitHub
        # regenerates on cache miss and has moved under a pinned digest before.
        # The flags drop uid, gid, mtimes and directory order so the archive's
        # digest tracks the configuration, not the machine that packed it.
        run: |
          tar --create --gzip \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            --file otelcol-otelbox_config.tar.gz \
            config/edge.yaml config/gateway.yaml config/host-agent.yaml

          actual="$(tar --list --file otelcol-otelbox_config.tar.gz)"
          expected="$(printf '%s\n' \
            config/edge.yaml config/gateway.yaml config/host-agent.yaml)"
          if [[ "$actual" != "$expected" ]]; then
            echo "configuration bundle contains an unexpected path set:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          printf '%s\n' "$actual"

      - name: Check the Homebrew configuration contract
        run: |
          ruby -c Formula/otelcol-otelbox.rb
          grep -Fq \
            '(pkgshare/"config").install "edge.yaml", "gateway.yaml", "host-agent.yaml"' \
            Formula/otelcol-otelbox.rb

      - name: Upload the configuration bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelcol-otelbox_config
          path: otelcol-otelbox_config.tar.gz
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: End-to-end delivery, durability and queue-pressure tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Restore the executable bit
        # See validate-config: artefact downloads come back without the mode.
        run: chmod +x otelcol-otelbox_linux_amd64

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          # The harness is stdlib-only, so there is no go.sum for setup-go to
          # key a cache on and it fails the step outright.
          cache: false

      - name: Run the end-to-end harness
        # THE TRAP THIS STEP EXISTS FOR. The deployed edge failed every export
        # for days while the process ran, the health endpoint answered 200 and
        # the receiver accepted everything — none of which proves delivery, so a
        # wrong token looked exactly like a healthy collector. The smoke check
        # shares that blind spot; this harness asserts on the far end.
        #
        # `-args` hands -otelcol-binary to the test binary verbatim, absolute
        # because the tests run in their own directory. `-count=1` because a
        # cached PASS would be a green tick for a binary this run never touched.
        working-directory: test/harness
        run: |
          go test . -count=1 -v -timeout 15m \
            -args -otelcol-binary "${GITHUB_WORKSPACE}/otelcol-otelbox_linux_amd64"

  image:
    name: Container image (GHCR)
    needs: [resolve, static-check, build, validate-config, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary into the build context
        # The Dockerfile packages and never compiles, so the image ships the
        # exact binary this run tested rather than a second build of it.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Stamp the build metadata
        id: stamp
        # The labels are what an operator correlates a running container back to
        # a commit with, so they carry real values rather than the defaults.
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        # Only when something is pushed: a fork's pull request gets a read-only
        # token, and logging in with it would fail the job for nothing.
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite an existing versioned image
        if: needs.resolve.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
        run: |
          if existing="$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1)"; then
            echo "$IMAGE_REF already exists — refusing to overwrite an immutable version tag" >&2
            exit 1
          fi
          if [[ "$existing" != *"not found"* && "$existing" != *"manifest unknown"* ]]; then
            echo "could not determine whether $IMAGE_REF exists:" >&2
            printf '%s\n' "$existing" >&2
            exit 1
          fi

      - name: Build the image
        id: build
        # Load the single-platform image into the runner so the exact manifest
        # can be scanned before any registry write is possible.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          # A provenance attestation turns a single-platform push into a
          # manifest index, and the published digest would then name the index
          # rather than the bytes the deployment pins.
          provenance: false
          sbom: false
          # No `latest`: a moving tag is what pinning by digest exists to avoid,
          # and offering both invites a reconcile against whichever is easier.
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
          # UPSTREAM_VERSION is separate because neither implies the other, and
          # an operator has to be able to tell which collector is inside.
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            UPSTREAM_VERSION=${{ needs.resolve.outputs.upstream_version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.stamp.outputs.created }}

      - name: Scan the image for fixable high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
          version: v0.70.0
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          cache: false

      - name: Smoke-test the packaged binary
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker run --rm --network none --read-only "$IMAGE_REF" components \
            > "$RUNNER_TEMP/image-components.yaml"
          grep -Fq "    version: $VERSION" "$RUNNER_TEMP/image-components.yaml"
          grep -Fq "    - name: otlp_grpc" "$RUNNER_TEMP/image-components.yaml"

      - name: Publish the scanned image
        id: publish
        if: needs.resolve.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
        run: |
          docker push "$IMAGE_REF"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_REF")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid image digest: ${digest:-<empty>}" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: [resolve, static-check, build, validate-config, integration-test, image, config-bundle]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    env:
      GH_TOKEN: ${{ github.token }}
      # This job never checks out, so `gh` has no remote to infer the target
      # repository from and has to be told.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.resolve.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
      IMAGE: ${{ needs.resolve.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Download the binaries, their checksums and the configuration bundle
        # Every artefact meant for the release is named for the asset it
        # becomes, so a new asset needs a new job and nothing here.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: otelcol-otelbox_*
          merge-multiple: true
          path: dist

      - name: Record the image digest as a release asset
        # The server's Compose file lives in another repository and must pin a
        # digest without reading across the boundary, and the release is the one
        # surface both sides already agree on.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "the image job produced no digest — refusing to publish a release" >&2
            echo "  that would advertise an image nobody can pin" >&2
            exit 1
          fi
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image-digest.txt
          cat dist/image-digest.txt

      - name: Verify the downloaded binary checksums
        run: |
          for asset in otelcol-otelbox_darwin_arm64 otelcol-otelbox_linux_amd64; do
            checksum="$(cat "dist/${asset}.sha256")"
            if ! [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || [ "$(wc -l < "dist/${asset}.sha256")" -ne 1 ]; then
              echo "dist/${asset}.sha256 is not one bare lowercase SHA-256 digest" >&2
              exit 1
            fi
            actual="$(sha256sum "dist/$asset" | awk '{ print $1 }')"
            if [ "$actual" != "$checksum" ]; then
              echo "checksum mismatch for dist/$asset" >&2
              exit 1
            fi
          done

      - name: Compose the release notes
        # The upstream version is stated in prose because the release number is
        # this artefact's own and says nothing about it.
        run: |
          cat > notes.md <<EOF
          OCB-built durable OpenTelemetry collector, version ${VERSION}, built
          from OpenTelemetry Collector \`v${UPSTREAM_VERSION}\`. One binary,
          three roles: **edge** on a macOS workstation, **gateway** and
          **host-agent** on the Ubuntu x86-64 server.

          ## Binaries

          | Asset | Target | Roles |
          | --- | --- | --- |
          | \`otelcol-otelbox_darwin_arm64\` | darwin/arm64 | edge |
          | \`otelcol-otelbox_linux_amd64\` | linux/amd64 | gateway, host-agent |

          Each ships a matching \`.sha256\` holding the bare hex digest, no
          filename column.

          ## Configuration

          \`otelcol-otelbox_config.tar.gz\` holds the three role profiles as they
          were validated for this version, under a single \`config/\` directory.
          There is no shared base layer any more: each profile is one
          self-contained file, loaded on its own. It is what the Homebrew
          formula installs alongside the binary; a deployment can also use it to
          diff a rendered configuration against the profile CI actually proved.

          ## Install on macOS (darwin/arm64)

          This repository is not named \`homebrew-otelbox\`, so the one-argument
          \`brew tap\` shorthand cannot find it. Name the tap and its remote
          explicitly — once:

          \`\`\`
          brew tap abrosimov/otelbox https://github.com/abrosimov/otelcol-otelbox
          brew install abrosimov/otelbox/otelcol-otelbox
          \`\`\`

          The tap is this repository itself, so \`brew update\` picks up every
          later version from the same clone:

          \`\`\`
          brew upgrade abrosimov/otelbox/otelcol-otelbox
          \`\`\`

          The formula installs the artefact only. It carries no
          \`brew services\` definition on purpose: the workstation edge is
          supervised by the launchd agent \`devbox-setup\` installs, and a second
          supervisor would race it for the same loopback listeners.

          ## Container image

          \`\`\`
          ${IMAGE}:${VERSION}
          ${IMAGE}@${DIGEST}
          \`\`\`

          Pin the digest, not the tag. The \`image-digest.txt\` asset carries the
          same reference on one line for machine consumption:

          \`\`\`
          gh release download v${VERSION} --pattern image-digest.txt --output -
          \`\`\`

          ## What CI proved before this was published

          - both binaries link every component \`builder.yaml\` declares, checked
            natively on each target;
          - the edge, gateway and host-agent profiles each load on their own,
            and their shared blocks are byte-identical across all three;
          - independent edge and gateway runs stripped the configured credential
            corpus from logs, traces and metrics without changing representative
            ordinary values; the selected-traces path was included;
          - a wrong ingestion token failed loudly in the edge's own metrics
            rather than dropping telemetry in silence;
          - a record acknowledged by the edge while the gateway was unavailable
            survived a forced edge process termination and was delivered after
            both processes returned;
          - only classified traces reached the generic OTLP/HTTP recipient with
            its required authorisation and protocol headers, and its WAL replayed
            an acknowledged trace after a forced gateway termination;
          - non-empty bearer allowlist replacement revoked the previous token;
          - under queue pressure, a stopped gateway recipient left its healthy
            neighbour and ingest untouched until its own queue filled, then
            backpressured the receiver through synchronous fan-out.

          Built from ${GITHUB_SHA}.
          EOF
          cat notes.md

      - name: Publish release
        # --target pins the tag to the commit that was tested, not to wherever
        # the branch has moved since. An existing tag or release is immutable.
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            dist/*

  formula:
    name: Refresh the Homebrew formula
    needs: [resolve, release]
    # The publish gate restated rather than inherited, so the `contents: write`
    # grant below is visibly conditional on it rather than on a chain the reader
    # has to reconstruct.
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refreshed formula
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      FORMULA: Formula/otelcol-otelbox.rb
    steps:
      # WHY CI WRITES THE FORMULA INSTEAD OF CHECKING IT. A checksum cannot be
      # known before the release exists, so a drift check would go red on every
      # version bump by construction — and a gate that always fails is one
      # people learn to ignore. The price is a CI commit on the default branch,
      # bounded to one file after a successful publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push event checks out a detached SHA, with nothing to commit onto.
          ref: ${{ github.ref_name }}
          # Stated because the action's default has moved across major
          # versions, and without it the push fails at the end of a good run.
          persist-credentials: true

      - name: Hash the assets the release actually serves
        id: digests
        # Hashed from the release rather than from this run's artefacts, which
        # hold the same bytes: what `brew install` fetches is what the release
        # serves, and one failed upload would part the two.
        run: |
          gh release download "v${VERSION}" \
            --pattern otelcol-otelbox_darwin_arm64 \
            --pattern otelcol-otelbox_config.tar.gz \
            --dir published

          # Assignments rather than substitutions inside `echo`, so a failure
          # stops the job: `sha256 ""` passes every check and installs nothing.
          binary_sha="$(sha256sum published/otelcol-otelbox_darwin_arm64 | awk '{print $1}')"
          config_sha="$(sha256sum published/otelcol-otelbox_config.tar.gz | awk '{print $1}')"
          for digest in "$binary_sha" "$config_sha"; do
            case "$digest" in
              [0-9a-f][0-9a-f]*) ;;
              *) echo "not a hex digest: '$digest'" >&2; exit 1 ;;
            esac
            if [ "${#digest}" -ne 64 ]; then
              echo "digest '$digest' is ${#digest} characters, not 64" >&2
              exit 1
            fi
          done

          {
            echo "binary=$binary_sha"
            echo "config=$config_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite the version-bearing literals
        env:
          BINARY_SHA: ${{ steps.digests.outputs.binary }}
          CONFIG_SHA: ${{ steps.digests.outputs.config }}
        # Anchored on the formula's shape — the `version` line and the two
        # `sha256` lines told apart by the indentation `brew style` enforces.
        # The tag is matched through the download path because a bare `v1.2.3`
        # is not distinctive enough: `v[^/"]*/` would hit the owner login first.
        run: |
          sed -i -E \
            -e "s|^  version \".*\"\$|  version \"${VERSION}\"|" \
            -e "s|/releases/download/v[^/\"]*/|/releases/download/v${VERSION}/|g" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"${BINARY_SHA}\"|" \
            -e "s|^    sha256 \".*\"\$|    sha256 \"${CONFIG_SHA}\"|" \
            "$FORMULA"

      - name: Verify the rewrite before it is committed
        env:
          BINARY_SHA: ${{ steps.digests.outputs.binary }}
          CONFIG_SHA: ${{ steps.digests.outputs.config }}
        # A sed that matched nothing exits 0 and leaves the old version behind,
        # which is the silent staleness this job exists to prevent.
        run: |
          ruby -c "$FORMULA" > /dev/null

          fail() {
            echo "the formula rewrite did not take: $1" >&2
            echo "  the sed anchors no longer match Formula/otelcol-otelbox.rb" >&2
            exit 1
          }

          grep -qxF "  version \"${VERSION}\"" "$FORMULA" || fail "version"
          grep -qxF "  sha256 \"${BINARY_SHA}\"" "$FORMULA" || fail "binary checksum"
          grep -qxF "    sha256 \"${CONFIG_SHA}\"" "$FORMULA" || fail "config bundle checksum"

          # `sort -u` collapses the two agreeing URLs into one line, so anything
          # else is a half-applied rewrite that a matched URL could hide. The
          # owner and repository segments come from GITHUB_REPOSITORY so a
          # rename is caught here rather than left pointing at a dead release.
          # `|| true` keeps an empty capture reaching the diagnostic below
          # instead of aborting the step.
          urls="$(grep -oE 'https://github\.com/[^"/]+/[^"/]+/releases/download/[^/"]+' \
            "$FORMULA" | sort -u || true)"
          expected="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          if [ "$urls" != "$expected" ]; then
            echo "the formula does not point at exactly one release, ${expected}:" >&2
            printf '%s\n' "${urls:-<no release download URL found at all>}" >&2
            exit 1
          fi

      - name: Commit and push the refreshed formula
        # GITHUB_TOKEN pushes do not start another workflow run, so the bot
        # commit cannot recurse even though Formula/** is in the path filters.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "the formula already describes v${VERSION}"
            exit 0
          fi
          git commit -m "Pin the Homebrew formula to otelcol-otelbox ${VERSION}"
          # The branch may have moved while the build ran. One rebase suffices:
          # the concurrency group leaves no third writer to race.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Summarise the installation channel
        run: |
          {
            echo "### Homebrew"
            echo ""
            echo '```'
            echo "brew tap abrosimov/otelbox https://github.com/${GITHUB_REPOSITORY}"
            echo "brew install abrosimov/otelbox/otelcol-otelbox"
            echo '```'
            echo ""
            echo "Formula pinned to \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
