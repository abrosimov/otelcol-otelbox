name: otelcol-otelbox

# Build, prove and publish the slim OCB collector for both roles it serves:
# `edge` on a macOS workstation (darwin/arm64) and `gateway` on the Ubuntu
# server (linux/amd64).
#
# VERSION. `dist.version` in builder.yaml is the single source of truth, and it
# is this artefact's own semantic version rather than the upstream collector's.
# Bump it, merge to master, and this workflow publishes the matching
# `v<version>` release — no hand-cut tags, there is no tag trigger and pushing
# one does nothing. The tag carries no artefact prefix: this repository produces
# exactly one artefact, so a prefix would only repeat its name on every tag. The
# upstream version is read from the manifest's gomod pins instead, and travels
# to the image and the release notes as a value of its own, because the version
# number does not carry it.
#
# WHAT RUNS WHEN. Building and testing run on every change to an input that
# could break them (the manifest, the shared config layer, the role profiles,
# the harness, the Dockerfile, this file) and on every pull request. Publishing
# — the GHCR push and the GitHub release — is gated separately, on all three of:
# the version being new, the run being on the default branch, and the event not
# being a pull request.
#
# The release-existence check gates publishing and nothing else, and must not be
# allowed to gate more. Hang the whole graph off it and a change to
# config/base.yaml or to test/integration-test.sh goes unbuilt and untested
# whenever the version it belongs to is already released — CI then reports green
# on code it has never compiled. Idempotence is kept where it belongs: an
# existing release is never re-published or overwritten. To re-publish a
# version, delete its release first, then `gh workflow run otelcol-otelbox.yml`.
#
# The consuming repositories read the same dist.version and download the
# published assets; deployment itself lives there, not here.
#
# HOMEBREW. A formula pins a version and two checksums, and neither checksum can
# exist before the release does, so the formula is written by the run that
# publishes the release rather than by a human ahead of it — see the `formula`
# job at the bottom. That is why this workflow writes to the repository, which
# nothing else here does.

on:
  # The two path lists below are duplicated rather than shared through a YAML
  # anchor: the Actions parser does not resolve aliases, so an anchor here would
  # silently produce an empty filter and the workflow would run on everything.
  # Keep them in step.
  push:
    branches: [master]
    # Every path that can change what is built or what the tests prove.
    # README.md and CLAUDE.md are deliberately absent: they cannot break a build.
    paths:
      - builder.yaml
      - smoke-check.sh
      - Dockerfile
      - .dockerignore
      - config/**
      - test/**
      - .github/workflows/otelcol-otelbox.yml
  pull_request:
    paths:
      - builder.yaml
      - smoke-check.sh
      - Dockerfile
      - .dockerignore
      - config/**
      - test/**
      - .github/workflows/otelcol-otelbox.yml
  workflow_dispatch: {}

# Denied at the top, granted per job. The jobs differ — only `release` writes
# contents and only `image` writes packages — so a workflow-level grant would
# hand every job the union of what any one of them needs.
permissions: {}

concurrency:
  group: otelcol-otelbox-${{ github.ref }}
  # A superseded pull-request run is worth nothing, so cancel it. A run on the
  # default branch may be halfway through pushing an image or creating a
  # release, and cancelling that leaves a half-published version behind.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve version, release state and publish decision
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release view
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
      publish: ${{ steps.resolve.outputs.publish }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version from builder.yaml and decide whether to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(grep -E '^  version:' builder.yaml | head -1 | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "could not read dist.version from builder.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # OCB must match the core collector modules it compiles, so the
          # toolchain version comes from the otlpreceiver pin — core, always
          # present, and moved by every upstream release — and deliberately not
          # from dist.version, which now describes this artefact alone.
          upstream_pin="$(grep -E 'collector/receiver/otlpreceiver v' builder.yaml \
            | head -1 | awk '{print $NF}')"
          if [ -z "$upstream_pin" ]; then
            echo "could not read the otlpreceiver gomod pin from builder.yaml" >&2
            exit 1
          fi
          upstream_version="${upstream_pin#v}"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

          # An upstream bump rewrites every pin by hand, and a line left behind
          # compiles perfectly and ships a collector built from two upstream
          # releases — nothing downstream would notice. Hence: all pins, one
          # version, the one OCB is installed at.
          disagreeing="$(grep -nE '^[[:space:]]*-[[:space:]]*gomod:' builder.yaml \
            | grep -vE "[[:space:]]${upstream_pin}[[:space:]]*\$" || true)"
          if [ -n "$disagreeing" ]; then
            echo "builder.yaml mixes upstream versions — these pins are not at ${upstream_pin}," >&2
            echo "which is what otlpreceiver says and what OCB will be installed at:" >&2
            printf '%s\n' "$disagreeing" >&2
            echo "  bring every pin to one version. If upstream has genuinely stopped" >&2
            echo "  releasing its modules in lockstep, this guard is the thing that is" >&2
            echo "  wrong and needs replacing — the pins are not." >&2
            exit 1
          fi

          # GHCR package names must be lowercase; the owner login need not be.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/otelcol-otelbox"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

          # Publishing is the only thing gated here. Building and testing run
          # unconditionally below: a change to the config layer or the harness
          # must be compiled and exercised even when the version it belongs to
          # is already released.
          publish=false
          if [ "$release_exists" = "true" ]; then
            reason="release v$version already exists"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            reason="pull request — build and test only, never publish"
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            reason="ref '$GITHUB_REF_NAME' is not the default branch '$DEFAULT_BRANCH'"
          else
            publish=true
            reason="version $version is new and this is $DEFAULT_BRANCH"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          {
            echo "### otelcol-otelbox $version"
            echo ""
            echo "- upstream collector: \`$upstream_pin\` (from the gomod pins; also the OCB toolchain)"
            echo "- image: \`$image:$version\`"
            echo "- publish: \`$publish\` — $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # A darwin-only failure must not hide the linux result, and vice versa:
      # the two targets share a manifest but not a toolchain or a runner image.
      fail-fast: false
      matrix:
        include:
          # Each target builds on a runner of its own architecture, because the
          # smoke check below executes the binary to read its own `components`
          # output. A cross-built binary cannot be checked at all — there is
          # nothing on the other platform that can run it.
          # Pinned to an explicit image rather than macos-latest: the -latest
          # alias moves to each new GA image and would change the build host
          # without a commit here. macos-14 was deprecated by GitHub.
          - goos: darwin
            goarch: arm64
            runner: macos-26
            asset: otelcol-otelbox_darwin_arm64
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            asset: otelcol-otelbox_linux_amd64
    env:
      OCB_VERSION: ${{ needs.resolve.outputs.upstream_version }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # There is no Go source and no go.sum at the repository root — OCB
          # generates both into _build/ during this job. With caching left on,
          # setup-go looks for a dependency file to key the cache on, finds
          # none, and fails the step before a single line is compiled.
          cache: false

      - name: Install OpenTelemetry Collector Builder (OCB)
        # The upstream version the manifest pins, never dist.version — see the
        # resolve step.
        run: go install "go.opentelemetry.io/collector/cmd/builder@v${OCB_VERSION}"

      - name: Build otelcol-otelbox
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Static, for two reasons that happen to agree: the scratch image has
          # no libc to dynamically link against, and a workstation binary must
          # not depend on the CI runner's SDK version.
          CGO_ENABLED: "0"
        run: |
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          install -m 0755 _build/otelcol-otelbox "$ASSET"

      - name: Smoke-check linked components
        # Compares per-kind component counts against builder.yaml, so a dropped
        # component fails the build instead of shipping a silently thin binary.
        # Runs natively — see the matrix comment.
        run: ./smoke-check.sh "./$ASSET" builder.yaml

      - name: Checksum
        # sha256sum on Linux, shasum on macOS. Bare hex only, no filename
        # column: that is what the consuming repositories parse.
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"

      - name: Upload the binary and its checksum
        # The artefact is how every later job gets this binary. Nothing
        # downstream rebuilds it: the image, the config validation, the
        # integration test and the release all consume exactly these bytes, so
        # what was tested is what is shipped.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  validate-config:
    name: Validate the composed role profiles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary
        # Either binary would do: the two link an identical component set from
        # the same manifest, and `validate` unmarshals the configuration without
        # starting anything platform-specific. Linux is chosen because the
        # runner is a tenth of the price of a macOS one.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Restore the executable bit
        # The artefact upload does not preserve file modes, so what comes back
        # is 0644 and unrunnable. Every job that downloads a binary needs this.
        run: chmod +x otelcol-otelbox_linux_amd64

      - name: Validate the edge and gateway profiles as they actually compose
        # Neither role layer is a runnable configuration on its own, and neither
        # is the base layer: base carries the processors and self-telemetry, the
        # role layer carries the receivers, exporters, storage and pipelines.
        # They are therefore validated in the same order the deployment loads
        # them, base first, because a merge error can only appear in the
        # composition.
        env:
          # Both layers expand ${env:...} at load time, so validation needs a
          # value for every variable the profiles reference — an unset one is a
          # load error, not a default. Discovered by reading the configs:
          # edge needs OTELBOX_EDGE_{STORAGE,ENDPOINT,TOKEN}; gateway needs
          # OTELBOX_GATEWAY_{TOKEN_FILE,STORAGE} and CLICKSTACK_INGESTION_API_KEY.
          # The values are dummies — nothing is dialled or opened here.
          OTELBOX_EDGE_ENDPOINT: 127.0.0.1:4317
          OTELBOX_EDGE_TOKEN: ci-validation-placeholder
          CLICKSTACK_INGESTION_API_KEY: ci-validation-placeholder
        run: |
          state="$(mktemp -d)"
          export OTELBOX_EDGE_STORAGE="${state}/edge"
          export OTELBOX_GATEWAY_STORAGE="${state}/gateway"
          export OTELBOX_GATEWAY_TOKEN_FILE="${state}/ingest-tokens"
          # A real file rather than a bare path: bearertokenauth/ingest is given
          # a filename, and a validation that passed on a path pointing at
          # nothing would be weaker than one that does not.
          printf 'ci-validation-placeholder  not a real credential\n' \
            > "$OTELBOX_GATEWAY_TOKEN_FILE"

          echo "--- edge: config/base.yaml + config/examples/edge.yaml"
          ./otelcol-otelbox_linux_amd64 validate \
            --config config/base.yaml \
            --config config/examples/edge.yaml

          echo "--- gateway: config/base.yaml + config/examples/gateway.yaml"
          ./otelcol-otelbox_linux_amd64 validate \
            --config config/base.yaml \
            --config config/examples/gateway.yaml

  config-bundle:
    name: Package the published configuration layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the configuration bundle
        # Why a release asset at all: the Homebrew formula has to fetch the
        # shared base layer and the reference profiles from somewhere it can
        # checksum. The tag's auto-generated source tarball would need no new
        # asset, but GitHub regenerates those on cache miss and their bytes have
        # changed under a pinned digest before — which would break an installed
        # formula at some unrelated later date. A release asset is immutable.
        #
        # One top-level `config/` directory, because that is what Homebrew's
        # resource staging strips. The flags drop the runner's uid, gid, mtimes
        # and directory order from the archive, so its digest tracks the
        # configuration rather than facts about the machine that packed it.
        run: |
          tar --create --gzip \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            --file otelcol-otelbox_config.tar.gz \
            config
          tar --list --file otelcol-otelbox_config.tar.gz

      - name: Upload the configuration bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelcol-otelbox_config
          path: otelcol-otelbox_config.tar.gz
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: End-to-end edge → gateway integration test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Restore the executable bit
        # See validate-config: artefact downloads come back without the mode.
        run: chmod +x otelcol-otelbox_linux_amd64

      - name: Run the end-to-end pipeline test
        # THE TRAP THIS STEP EXISTS FOR. The deployed edge failed every export
        # for days while every local signal stayed green: the process ran, the
        # supervisor reported it alive, the health endpoint answered 200, the
        # OTLP receiver accepted everything sent to it. All of those prove the
        # local half of the pipeline and none of them prove delivery, so a wrong
        # ingestion token looked exactly like a healthy collector and the
        # telemetry was simply gone. The smoke check above has the same blind
        # spot by construction — it proves the binary contains components, not
        # that anything reaches the far end.
        #
        # This script stands the real thing up: two processes of this binary in
        # the two roles it serves, wired over loopback with the same
        # authenticated hop the deployment uses, asserting on what came out of
        # the far end. It needs the repository checked out — it resolves
        # config/base.yaml and the role profiles relative to its own location —
        # plus curl and od, both present on the runner. Its own bounded polls
        # cap a failing run at roughly four minutes; the job timeout above is
        # only a backstop.
        run: ./test/integration-test.sh ./otelcol-otelbox_linux_amd64

  image:
    name: Container image (GHCR)
    needs: [resolve, build, validate-config, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the linux binary into the build context
        # The Dockerfile packages, never compiles: it COPYs
        # otelcol-otelbox_linux_amd64 from the context root, and .dockerignore
        # whitelists exactly that name. So the image ships byte-for-byte the
        # binary this run built and tested, rather than a second one built from
        # the same source at a different moment.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcol-otelbox_linux_amd64

      - name: Stamp the build metadata
        id: stamp
        # Real values, not the Dockerfile's honest defaults: the labels are what
        # a server operator has to correlate a running container back to a
        # commit with.
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        # Only when something is going to be pushed. A pull request from a fork
        # gets a read-only token, and a login attempt with it would fail the job
        # for a step whose output is thrown away anyway.
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the image
        id: build_push
        # Built on every run so a broken Dockerfile is caught by the pull
        # request that broke it; pushed only when the release is going out.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ needs.resolve.outputs.publish == 'true' }}
          # Buildx would otherwise attach a provenance attestation, which turns
          # a single-platform push into a manifest index. The digest published
          # below would then name the index rather than the image, and the whole
          # point of publishing it is that the deployment can pin the exact
          # bytes it will run.
          provenance: false
          sbom: false
          # One tag, the exact version. No `latest`: a moving tag is precisely
          # what pinning by digest exists to avoid, and offering both invites
          # the server to be reconciled against whichever one was easier.
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
          # UPSTREAM_VERSION is separate from VERSION because neither implies
          # the other: an operator reading the image has to be able to tell
          # which collector release is inside it.
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            UPSTREAM_VERSION=${{ needs.resolve.outputs.upstream_version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.stamp.outputs.created }}

  release:
    name: Publish release
    needs: [resolve, build, validate-config, integration-test, image, config-bundle]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
      IMAGE: ${{ needs.resolve.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Download the binaries, their checksums and the configuration bundle
        # The `otelcol-otelbox_*` pattern is what makes this one step rather
        # than three: every artefact meant for the release is named for the
        # asset it becomes, so a new asset needs a new job and nothing here.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: otelcol-otelbox_*
          merge-multiple: true
          path: dist

      - name: Record the image digest as a release asset
        # How the digest is exposed, and why as a file. The server's Docker
        # Compose deployment lives in another repository and must pin
        # `image: ...@sha256:...` without reading builder.yaml across the
        # repository boundary. The release is the only surface both sides
        # already agree on, so the digest ships as an asset holding one
        # pinnable reference on a single line — trivial for Ansible or a shell
        # to consume — and is repeated in the notes for a human reading the
        # release page.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "the image job produced no digest — refusing to publish a release" >&2
            echo "  that would advertise an image nobody can pin" >&2
            exit 1
          fi
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image-digest.txt
          cat dist/image-digest.txt

      - name: Compose the release notes
        # The upstream version is stated rather than implied: the version number
        # is this artefact's own and says nothing about it, and a reader still
        # has to know which collector release is inside.
        run: |
          cat > notes.md <<EOF
          OCB-built durable OpenTelemetry collector, version ${VERSION}, built
          from OpenTelemetry Collector \`v${UPSTREAM_VERSION}\`. One binary, two
          roles: **edge** on a macOS workstation, **gateway** on the Ubuntu
          x86-64 server.

          ## Binaries

          | Asset | Target | Role |
          | --- | --- | --- |
          | \`otelcol-otelbox_darwin_arm64\` | darwin/arm64 | edge |
          | \`otelcol-otelbox_linux_amd64\` | linux/amd64 | gateway |

          Each ships a matching \`.sha256\` holding the bare hex digest, no
          filename column.

          ## Configuration layers

          \`otelcol-otelbox_config.tar.gz\` holds \`config/base.yaml\` and the
          reference role profiles as they were validated for this version, under
          a single \`config/\` directory. It is what the Homebrew formula
          installs alongside the binary; a deployment can also use it to diff a
          rendered configuration against the profile CI actually proved.

          ## Install on macOS (darwin/arm64)

          This repository is not named \`homebrew-otelbox\`, so the one-argument
          \`brew tap\` shorthand cannot find it. Name the tap and its remote
          explicitly — once:

          \`\`\`
          brew tap abrosimov/otelbox https://github.com/abrosimov/otelcol-otelbox
          brew install abrosimov/otelbox/otelcol-otelbox
          \`\`\`

          The tap is this repository itself, so \`brew update\` picks up every
          later version from the same clone:

          \`\`\`
          brew upgrade abrosimov/otelbox/otelcol-otelbox
          \`\`\`

          The formula installs the artefact only. It carries no
          \`brew services\` definition on purpose: the workstation edge is
          supervised by the launchd agent \`devbox-setup\` installs, and a second
          supervisor would race it for the same loopback listeners.

          ## Container image

          \`\`\`
          ${IMAGE}:${VERSION}
          ${IMAGE}@${DIGEST}
          \`\`\`

          Pin the digest, not the tag. The \`image-digest.txt\` asset carries the
          same reference on one line for machine consumption:

          \`\`\`
          gh release download v${VERSION} --pattern image-digest.txt --output -
          \`\`\`

          ## What CI proved before this was published

          - both binaries link every component \`builder.yaml\` declares, checked
            natively on each target;
          - \`config/base.yaml\` composes into a valid edge profile and a valid
            gateway profile;
          - a real edge → authenticated gateway → sink run delivered telemetry,
            stripped every credential-shaped value, and made a wrong ingestion
            token fail loudly in the edge's own metrics rather than drop
            telemetry in silence.

          Built from ${GITHUB_SHA}.
          EOF
          cat notes.md

      - name: Publish release
        # --target pins the tag to the commit that was actually built and
        # tested, rather than to whatever the default branch has moved to since.
        # The upload fallback covers the narrow race of two runs reaching this
        # step for the same new version; the publish gate keeps it from ever
        # touching a release that already existed when the run started.
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            dist/* \
          || gh release upload "$tag" dist/* --clobber

  formula:
    name: Refresh the Homebrew formula
    needs: [resolve, release]
    # The publish gate, restated rather than inherited silently. `release` only
    # runs when resolve decided to publish, and resolve decides false for every
    # pull request — fork or not, because the event name alone disqualifies it —
    # and for every ref that is not the default branch. Repeating the condition
    # here keeps the `contents: write` grant below visibly conditional on the
    # same thing rather than on a chain the reader has to reconstruct.
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refreshed formula
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      FORMULA: Formula/otelcol-otelbox.rb
    steps:
      # WHY CI WRITES THE FORMULA INSTEAD OF CHECKING IT.
      # A formula pins a version and the checksums of the assets at that
      # version. The checksums cannot be known before the release exists, so a
      # human cannot commit a correct formula ahead of the build, and a check
      # that merely failed on drift would therefore go red on every single
      # version bump, by construction, until someone downloaded the freshly
      # published asset and pasted its digest back. That is a gate that is
      # always failing for a reason nobody can pre-empt, which is a gate people
      # learn to ignore. The run that produces the bytes is the only actor that
      # can describe them honestly, so it does.
      #
      # The price, accepted knowingly: this workflow pushes a commit to the
      # default branch, and a repository whose CI writes to it is a repository
      # where `git log` no longer means only "what a human decided". It is
      # bounded — one file, one job, only after a successful publish, and the
      # step below refuses to push anything it cannot verify it just wrote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push event checks out a detached SHA and there is nothing to
          # commit onto. The publish gate already guarantees this ref is the
          # default branch.
          ref: ${{ github.ref_name }}
          # Stated rather than left to the action's default, which has not been
          # the same across its major versions: without credentials the push
          # below fails at the very end of a successful release run.
          persist-credentials: true

      - name: Hash the assets the release actually serves
        id: digests
        # Downloaded from the release rather than reused from this run's build
        # artefacts, which hold the same bytes. What `brew install` fetches is
        # what the release serves, so that is what gets hashed; pinning a digest
        # computed from anything else would leave one upload failure between the
        # formula and reality.
        run: |
          gh release download "v${VERSION}" \
            --pattern otelcol-otelbox_darwin_arm64 \
            --pattern otelcol-otelbox_config.tar.gz \
            --dir published

          # Assignments rather than substitutions inside `echo`, so that a
          # failure here stops the job. An empty digest would otherwise sail
          # through the rewrite and past its own verification — `sha256 ""` is
          # a line that matches everything asked of it and installs nothing.
          binary_sha="$(sha256sum published/otelcol-otelbox_darwin_arm64 | awk '{print $1}')"
          config_sha="$(sha256sum published/otelcol-otelbox_config.tar.gz | awk '{print $1}')"
          for digest in "$binary_sha" "$config_sha"; do
            case "$digest" in
              [0-9a-f][0-9a-f]*) ;;
              *) echo "not a hex digest: '$digest'" >&2; exit 1 ;;
            esac
            if [ "${#digest}" -ne 64 ]; then
              echo "digest '$digest' is ${#digest} characters, not 64" >&2
              exit 1
            fi
          done

          {
            echo "binary=$binary_sha"
            echo "config=$config_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite the version-bearing literals
        env:
          BINARY_SHA: ${{ steps.digests.outputs.binary }}
          CONFIG_SHA: ${{ steps.digests.outputs.config }}
        # Anchored on the formula's shape, not on marker comments: the `version`
        # line, the release-tag segment of every URL, and the two `sha256` lines
        # told apart by their indentation — two spaces at formula level, four
        # inside the `resource` block. `brew style` enforces exactly that
        # indentation, which is what makes it an anchor rather than a guess. The
        # verification step below is the backstop for the day it stops being one.
        #
        # The tag is bare — `v` and the version, with no artefact prefix in
        # front of it — so it is not a distinctive string and cannot be matched
        # on its own: `v[^/"]*/` would find the `v` in the owner login
        # `abrosimov/` first and rewrite that instead. The release download path
        # is what identifies a tag, and it is deliberately matched without the
        # repository segment, so a repository rename needs no edit here and is
        # caught by the sweep below instead.
        run: |
          sed -i -E \
            -e "s|^  version \".*\"\$|  version \"${VERSION}\"|" \
            -e "s|/releases/download/v[^/\"]*/|/releases/download/v${VERSION}/|g" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"${BINARY_SHA}\"|" \
            -e "s|^    sha256 \".*\"\$|    sha256 \"${CONFIG_SHA}\"|" \
            "$FORMULA"

      - name: Verify the rewrite before it is committed
        env:
          BINARY_SHA: ${{ steps.digests.outputs.binary }}
          CONFIG_SHA: ${{ steps.digests.outputs.config }}
        # A sed that matched nothing exits 0 and leaves the previous version in
        # place, which is precisely the silent staleness this job exists to
        # prevent. Every literal is therefore read back.
        run: |
          ruby -c "$FORMULA" > /dev/null

          fail() {
            echo "the formula rewrite did not take: $1" >&2
            echo "  the sed anchors no longer match Formula/otelcol-otelbox.rb" >&2
            exit 1
          }

          grep -qxF "  version \"${VERSION}\"" "$FORMULA" || fail "version"
          grep -qxF "  sha256 \"${BINARY_SHA}\"" "$FORMULA" || fail "binary checksum"
          grep -qxF "    sha256 \"${CONFIG_SHA}\"" "$FORMULA" || fail "config bundle checksum"

          # Every release download URL in the file must name this repository and
          # this version's tag, and no other, so a URL the sed missed cannot
          # hide behind one it rewrote. `sort -u` collapses the two URLs that
          # agree into one line, so anything but a single expected line is a
          # half-applied rewrite.
          #
          # WHY THE WHOLE URL PREFIX AND NOT THE TAG ALONE. A bare `v1.0.0` is
          # not a distinctive string, so the pattern has to be anchored on the
          # download path regardless; once it is, including the owner and
          # repository segments costs nothing and closes the neighbouring hole,
          # where both URLs carry the right tag but point at a repository the
          # release does not live in — which is what a repository rename leaves
          # behind, silently, in a file nothing else is watching.
          # `GITHUB_REPOSITORY` rather than a literal, so a rename is caught
          # instead of needing this line rewritten too. An empty capture fails
          # here as loudly as a wrong one:
          # a formula whose URLs no longer look like release downloads at all is
          # exactly the shape drift this step exists to refuse.
          #
          # `|| true` so that no match reaches the comparison as an empty string
          # and gets the diagnostic below, rather than aborting the step on the
          # assignment under whichever `-e`/`pipefail` combination the runner's
          # default shell is using this year.
          urls="$(grep -oE 'https://github\.com/[^"/]+/[^"/]+/releases/download/[^/"]+' \
            "$FORMULA" | sort -u || true)"
          expected="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          if [ "$urls" != "$expected" ]; then
            echo "the formula does not point at exactly one release, ${expected}:" >&2
            printf '%s\n' "${urls:-<no release download URL found at all>}" >&2
            exit 1
          fi

      - name: Commit and push the refreshed formula
        # Nothing re-triggers this workflow: a push authenticated with
        # GITHUB_TOKEN does not start workflow runs at all, and Formula/** is
        # absent from the path filters at the top independently of that.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "the formula already describes v${VERSION}"
            exit 0
          fi
          git commit -m "Pin the Homebrew formula to otelcol-otelbox ${VERSION}"
          # The branch may have moved while the build ran. One rebase is enough:
          # the run that moved it is queued behind this one on the shared
          # concurrency group, so there is no third writer to race.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Summarise the installation channel
        run: |
          {
            echo "### Homebrew"
            echo ""
            echo '```'
            echo "brew tap abrosimov/otelbox https://github.com/${GITHUB_REPOSITORY}"
            echo "brew install abrosimov/otelbox/otelcol-otelbox"
            echo '```'
            echo ""
            echo "Formula pinned to \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
