name: otelcol-otelbox

# Auto-release the slim OCB collector (darwin/arm64). The version is the SINGLE
# source of truth in builder.yaml (dist.version): bump it, merge to master, and
# this workflow builds + publishes the matching `otelcol-otelbox-v<version>`
# release — no hand-cut tags. Idempotent: if the release already exists, the
# build is skipped. workflow_dispatch forces a run (still guarded by release
# existence — delete the release to rebuild).
#
# The consuming repositories read the same dist.version and download the
# published asset; deployment itself lives there, not here.

on:
  push:
    branches: [master]
    paths: ["builder.yaml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: otelcol-otelbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Resolve version + release state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ocb_version: ${{ steps.resolve.outputs.ocb_version }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version from builder.yaml and check release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -E '^  version:' builder.yaml | head -1 | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "could not read dist.version from builder.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # dist.version is <upstream>-custom-<n>. The suffix names OUR component
          # set and has no upstream tag, so OCB must be installed at the bare
          # upstream part: `go install ...cmd/builder@v<dist.version>` 404s
          # (`-custom-<n>` parses as a valid semver pre-release, so Go does not
          # reject the string — it just fetches a tag that was never cut).
          ocb_version="${version%%-custom-*}"
          case "$ocb_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "dist.version '$version' has no bare X.Y.Z upstream prefix" >&2
              exit 1
              ;;
          esac
          echo "ocb_version=$ocb_version" >> "$GITHUB_OUTPUT"

          # Lockstep guard: OCB must match the core collector modules it compiles.
          # otlpreceiver is the anchor — it is core, always present, and its gomod
          # moves with every upstream bump.
          gomod_version="$(grep -E 'collector/receiver/otlpreceiver v' builder.yaml \
            | head -1 | awk '{print $NF}')"
          if [ "$gomod_version" != "v$ocb_version" ]; then
            echo "upstream part of dist.version (v$ocb_version) != otlpreceiver gomod ($gomod_version)" >&2
            echo "  bump dist.version and the gomod pins together" >&2
            exit 1
          fi

          if gh release view "otelcol-otelbox-v$version" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release otelcol-otelbox-v$version already exists — build will be skipped."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release otelcol-otelbox-v$version not found — will build and publish."
          fi

  build:
    name: Build (darwin/arm64) + release
    needs: check
    if: needs.check.outputs.release_exists == 'false'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.check.outputs.version }}
      OCB_VERSION: ${{ needs.check.outputs.ocb_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install OpenTelemetry Collector Builder (OCB)
        # OCB_VERSION, not VERSION: dist.version carries the -custom-<n> suffix,
        # which has no upstream tag. See the resolve step in the check job.
        run: go install go.opentelemetry.io/collector/cmd/builder@v${OCB_VERSION}

      - name: Build otelcol-otelbox
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          install -m 0755 _build/otelcol-otelbox otelcol-otelbox_darwin_arm64

      - name: Smoke-check linked components
        # Compares per-kind component counts against builder.yaml, so a dropped
        # component fails the build instead of shipping a silently thin binary.
        run: ./smoke-check.sh ./otelcol-otelbox_darwin_arm64 builder.yaml

      - name: Checksum
        run: shasum -a 256 otelcol-otelbox_darwin_arm64 | awk '{print $1}' > otelcol-otelbox_darwin_arm64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="otelcol-otelbox-v${VERSION}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "OCB-built durable collector (darwin/arm64). See README.md." \
            otelcol-otelbox_darwin_arm64 otelcol-otelbox_darwin_arm64.sha256 \
          || gh release upload "$tag" \
            otelcol-otelbox_darwin_arm64 otelcol-otelbox_darwin_arm64.sha256 --clobber
