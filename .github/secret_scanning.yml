# A repository-side scanner cannot tell a fabricated credential from a live one,
# and the redaction harness must carry values with a provider's exact shape for
# `redaction/secrets` to have anything to match. The corpus therefore assembles
# those shapes at run time, so no committed line matches a provider pattern;
# this file is the second layer, naming the one path that is allowed to look
# credential-like.
#
# `paths-ignore` suppresses secret scanning alerts for the listed paths on
# repositories where GitHub offers the setting. It does not rewrite history: an
# alert already raised against an earlier commit stays open until it is closed
# in the Security tab, and it is not a licence to keep a real credential here.
paths-ignore:
  - "test/harness/otlp_test.go"
