# otelbox — GATEWAY ROLE, ORDINARY NETWORK CI OVERLAY. Loaded SECOND by the
# ordinary-signal SIGKILL test.
#
# It keeps the reference pipelines and persistent queues, moving only listeners
# and the three signal exporters to controllable plaintext test endpoints.

extensions:
  healthcheckv2:
    http:
      endpoint: 127.0.0.1:34136

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:34357
      http:
        endpoint: 127.0.0.1:34358

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-gateway
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:1

exporters:
  otlp_grpc/logs:
    endpoint: ${env:OTELBOX_CI_ORDINARY_ENDPOINT}
    tls:
      insecure: true
  otlp_grpc/metrics:
    endpoint: ${env:OTELBOX_CI_ORDINARY_ENDPOINT}
    tls:
      insecure: true
  otlp_grpc/traces:
    endpoint: ${env:OTELBOX_CI_ORDINARY_ENDPOINT}
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 34909
