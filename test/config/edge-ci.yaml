# otelbox — EDGE ROLE, CI OVERLAY. Loaded THIRD, only by test/harness
# (TestEdgeToGatewayDelivery):
#
#   otelcol-otelbox --config config/base.yaml \
#                   --config config/examples/edge.yaml \
#                   --config test/config/edge-ci.yaml
#
# CI ONLY — never copy any part of this into a deployment; it turns off TLS
# verification on the edge→gateway leg. It changes ports and that one setting
# and nothing else: a test run against retuned batch, queue or redaction values
# would prove nothing about what is deployed.
#
# Environment, exactly as launchd supplies it: OTELBOX_EDGE_STORAGE,
# OTELBOX_EDGE_ENDPOINT, OTELBOX_EDGE_TOKEN.

extensions:
  # The 34xxx block misses both a workstation edge (4317/4318/13133/8888) and
  # the server gateway, so a test can never quietly exercise a running collector.
  health_check:
    endpoint: 127.0.0.1:34133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:34317
      http:
        endpoint: 127.0.0.1:34318

exporters:
  otlp_grpc/gateway:
    tls:
      # Safe only here: both ends are this process's own loopback, so minting a
      # chain for 127.0.0.1 would test the runner's trust store, not the
      # collector. In any deployment the value is `false` — see
      # config/examples/edge.yaml for what the token is exposed to otherwise.
      insecure: true

service:
  telemetry:
    metrics:
      # The send-failed assertion scrapes this endpoint, so the test has to
      # reach it. A list, so it replaces the base layer's 8888 outright.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 34888
