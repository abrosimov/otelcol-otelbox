# otelbox — CI BACKEND DOUBLE. Not a role, and never composed with
# config/base.yaml:
#
#   otelcol-otelbox --config test/config/backend-ci.yaml
#
# CI ONLY, never copied into a deployment. It stands in for SigNoz and
# ClickStack in the coupling scenario, which needs a backend that can be
# *stopped* — a process can be killed, a file handle cannot. Trivial on purpose:
# receiver straight to file, no processors, so nothing it did to the data could
# be attributed to the collector under test.
#
# Two run side by side, so every endpoint and path comes from the environment:
# OTELBOX_CI_BACKEND_ENDPOINT, OTELBOX_CI_BACKEND_SINK,
# OTELBOX_CI_BACKEND_METRICS_PORT.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELBOX_CI_BACKEND_ENDPOINT}

exporters:
  file/sink:
    path: ${env:OTELBOX_CI_BACKEND_SINK}
    format: json
    # Below the 1s default: the flush interval is dead time added to every
    # bounded wait in the test.
    flush_interval: 200ms

service:
  telemetry:
    metrics:
      # Per instance from the environment: the default 8888 would collide with
      # the other double and with a developer's own edge.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: ${env:OTELBOX_CI_BACKEND_METRICS_PORT}
  pipelines:
    # All three signals, though only logs are sent: a double refusing a signal
    # would surface as an obscure export error rather than a named failure.
    traces:
      receivers: [otlp]
      exporters: [file/sink]
    metrics:
      receivers: [otlp]
      exporters: [file/sink]
    logs:
      receivers: [otlp]
      exporters: [file/sink]
