# otelbox — GATEWAY ROLE, BACKEND-COUPLING CI OVERLAY. Loaded SECOND, only by
# test/harness (TestRequiredRecipientCouplingUnderQueuePressure):
#
#   otelcol-otelbox --config config/gateway.yaml \
#                   --config test/config/gateway-coupling-ci.yaml
#
# CI ONLY, never copied into a deployment. A second gateway overlay because
# gateway-ci.yaml's `file` sink cannot be stopped and its queue cannot fill:
# this one adds a second all-signal recipient to the reference recipient and
# points both at processes the test can control.
#
# Only queue sizes, plaintext test transport and ports move, and none of them is
# what is asserted: the claim is that a *full* queue couples the recipients, not
# how long the deployed queue takes to fill.
#
# Environment, minus OTELBOX_BIND_HOST and OTELBOX_HEALTH_ENDPOINT, which this
# layer replaces every reference to, and minus the reference recipient endpoint,
# which it replaces with the CI double: OTELBOX_INGEST_TOKEN_FILE,
# OTELBOX_STORAGE_DIR, OTELBOX_CI_HEALTHY_ENDPOINT, OTELBOX_CI_STALLED_ENDPOINT.

extensions:
  healthcheckv2:
    http:
      # A port of its own inside the 34xxx block: this gateway runs alongside
      # the delivery test's, and two processes cannot share one listener.
      endpoint: 127.0.0.1:34135

  file_storage/coupling_stalled:
    directory: ${env:OTELBOX_STORAGE_DIR}/coupling_stalled
    create_directory: true
    fsync: true
    max_size: ${env:OTELBOX_RECIPIENT_STORAGE_MAX_SIZE_BYTES:-12884901888}
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_STORAGE_DIR}/compaction/coupling_stalled
      cleanup_on_start: true

receivers:
  # `auth:` is inherited from the role profile and still enforced — a later
  # layer cannot remove a key — so the scenario posts to 34348 with a token from
  # the one allowlist.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:34347
      http:
        endpoint: 127.0.0.1:34348

  # A literal target, because the harness supplies no OTELBOX_BIND_HOST and
  # expansion runs over the merged map. The pipeline below keeps it but points
  # it at a dead test address.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-gateway
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:1

exporters:
  otlp_grpc/all_signals:
    endpoint: ${env:OTELBOX_CI_HEALTHY_ENDPOINT}
    # The backend doubles speak plaintext; production exporters retain secure
    # defaults.
    tls:
      insecure: true
    sending_queue:
      # Eight times the other queue: this backend stays up and must never be the
      # thing that blocks, or a stall could not be attributed to its neighbour.
      queue_size: 16777216
  otlp_grpc/coupling_stalled:
    endpoint: ${env:OTELBOX_CI_STALLED_ENDPOINT}
    compression: gzip
    timeout: 10s
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage/coupling_stalled
      num_consumers: ${env:OTELBOX_EXPORTER_CONSUMERS:-2}
      sizer: bytes
      # The 512 KiB test records fit. A larger-than-capacity item would block
      # until its request context expires because this is a persistent queue.
      queue_size: 2097152
      block_on_overflow: true
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 1048576
        max_size: ${env:OTELBOX_RECIPIENT_MAX_PAYLOAD_BYTES:-3145728}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  # Lists replace rather than merge, so the overlay restates the reference
  # extensions while adding the test-only WAL.
  extensions:
    - healthcheckv2
    - bearertokenauth/ingest
    - headers_setter/selected_traces
    - file_storage/all_signals
    - file_storage/selected_traces
    - file_storage/coupling_stalled
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 34899
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals, otlp_grpc/coupling_stalled]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals, otlp_grpc/coupling_stalled]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals, otlp_grpc/coupling_stalled]
    # The dead target above prevents self telemetry from changing the fill rate.
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, redaction/secrets]
      exporters: [otlp_grpc/all_signals, otlp_grpc/coupling_stalled]
