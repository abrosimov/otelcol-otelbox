# otelbox — GATEWAY ROLE, CI OVERLAY. Loaded SECOND, only by test/harness
# delivery and durability scenarios:
#
#   otelcol-otelbox --config config/gateway.yaml \
#                   --config test/config/gateway-ci.yaml
#
# CI ONLY, never copied into a deployment. It moves the listeners into the 34xxx
# block and swaps the ordinary gRPC recipient for a sink the test can read. The
# selected-traces HTTP recipient remains attached so the harness can verify its
# filter, protocol headers and WAL. Auth, redaction, limits and processor order
# are left alone. A `file` sink cannot be stopped, hence the separate
# gateway-coupling-ci.yaml.
#
# Environment, minus OTELBOX_BIND_HOST and OTELBOX_HEALTH_ENDPOINT, which this
# layer replaces every reference to: the role's required environment plus
# OTELBOX_CI_SINK, OTELBOX_CI_GATEWAY_CERT_FILE and
# OTELBOX_CI_GATEWAY_KEY_FILE.

extensions:
  healthcheckv2:
    http:
      # Into the 34xxx block, a literal so the harness supplies no variable for
      # it. Nothing polls this one — the gateway's readiness is established by
      # the 401 precondition — but the extension is inherited and must bind
      # somewhere that is not a running deployment.
      endpoint: 127.0.0.1:34134

exporters:
  # `append: false` (the default) truncates on start, so a rerun cannot pass on
  # a marker the previous run left behind.
  file/sink:
    path: ${env:OTELBOX_CI_SINK}
    format: json
    # Below the 1s default: the flush interval is dead time added to every
    # bounded wait in the test.
    flush_interval: 200ms

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:34327
        # The far end of the one leg this repository fixes at `insecure: false`,
        # so CI serves a real certificate rather than leaving the only
        # production TLS setting on the main leg unexercised. Minted per run by
        # the harness, with 127.0.0.1 as an IP SAN.
        tls:
          cert_file: ${env:OTELBOX_CI_GATEWAY_CERT_FILE}
          key_file: ${env:OTELBOX_CI_GATEWAY_KEY_FILE}
      # Plaintext, and deliberately: the harness probes this endpoint to
      # establish that unauthenticated ingest is refused, which is a question
      # about the authenticator rather than the transport.
      http:
        endpoint: 127.0.0.1:34328

  # A literal target, because the harness supplies no OTELBOX_BIND_HOST and
  # expansion runs over the merged map. Nothing scrapes it: the pipeline below
  # drops this receiver, so it is configured and never built.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-gateway
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:34889

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 34889
  pipelines:
    # Every pipeline is restated because lists replace rather than merge —
    # naming only the exporters would leave the reference recipient attached.
    # `processors` is restated identically on purpose: it is the line a reviewer
    # checks when asking whether the test still runs redaction.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [file/sink]
    # Inherited unchanged: the selected-traces HTTP exporter and its persistent
    # queue are part of the contract this overlay is used to prove.
    traces/selected:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets, filter/selected_traces]
      exporters: [otlp_http/selected_traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [file/sink]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [file/sink]
    # Only the exporters need swapping here now: this pipeline's one receiver is
    # the self-scrape, repointed above, and it opens nothing the runner lacks.
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, redaction/secrets]
      exporters: [file/sink]
